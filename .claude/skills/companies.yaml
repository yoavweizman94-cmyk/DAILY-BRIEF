# ---------------------------------------------------------------------------
# קטלוג דרייברים מרכזיים → מקור נתונים
# ---------------------------------------------------------------------------
drivers_catalog:
  boi_rate:               {desc: ריבית בנק ישראל והצפי, source: BOI}
  mortgage_volumes:       {desc: נטילות משכנתאות חודשיות, source: BOI}
  cbs_home_price_index:   {desc: מדד מחירי דירות, source: skill israeli-statistics}
  cbs_building_starts:    {desc: התחלות וגמר בנייה, source: skill israeli-statistics}
  building_inputs_index:  {desc: מדד תשומות הבנייה, source: skill israeli-statistics}
  cpi_il:                 {desc: מדד המחירים לצרכן + הצמדות, source: skill israeli-statistics}
  rmi_tenders:            {desc: מכרזי קרקע רמ"י, source: skill israeli-land-tenders}
  fx_usd_ils:             {desc: 'שער יציג דולר/שקל', source: BOI API}
  fx_eur_ils:             {desc: 'שער יציג אירו/שקל', source: BOI API}
  crude_oil:              {desc: 'ברנט/WTI → נגזר לפולימרים ולוגיסטיקה', source: yfinance BZ=F CL=F}
  polymers:               {desc: 'מחירי PE/PP/PVC/פוליקרבונט (פרוקסי: נפט + מקורות ענפיים)', source: markets_pull}
  aluminum_lme:           {desc: אלומיניום LME, source: yfinance ALI=F}
  steel:                  {desc: פלדה/ברזל בנייה, source: markets_pull}
  soft_commodities:       {desc: 'חיטה/תירס/סויה/סוכר/קקאו/חלב', source: yfinance}
  shipping_freight:       {desc: מחירי הובלה ימית ומכולות, source: markets_pull}
  us10y:                  {desc: תשואת אג"ח ארה"ב 10ש, source: yfinance ^TNX}
  il_gov_yields:          {desc: תשואות ממשלתי שקלי/צמוד, source: markets_pull}
  nasdaq_sentiment:       {desc: מדדי טק ארה"ב, source: yfinance}
  construction_labor:     {desc: 'זמינות כוח אדם בענף הבנייה (עובדים זרים/פלסטינים)', source: news}
  planning_policy:        {desc: 'רגולציית תכנון — ותמ"ל, שבס, היטלים', source: news + maya}
  defense_budgets:        {desc: תקציבי ביטחון והזמנות משהב"ט, source: news + maya}

# ---------------------------------------------------------------------------
# פרופילי סקטור
# ---------------------------------------------------------------------------
sector_profiles:

  resi_dev_il:
    label: יזום למגורים — ישראל
    drivers: [boi_rate, mortgage_volumes, cbs_home_price_index, cbs_building_starts,
              building_inputs_index, rmi_tenders, planning_policy, construction_labor,
              il_gov_yields, cpi_il]

  urban_renewal:
    label: התחדשות עירונית
    inherits: resi_dev_il
    drivers_extra: [renewal_regulation, municipal_planning]

  income_il:
    label: נדל"ן מניב — ישראל
    drivers: [il_gov_yields, cpi_il, boi_rate, office_retail_demand, cap_rates]

  income_intl:
    label: נדל"ן מניב/יזום — חו"ל
    drivers: [fx_eur_ils, fx_usd_ils, us10y, ecb_fed_policy, local_re_markets]

  rental_reit:
    label: קרנות ריט לדיור להשכרה
    drivers: [cpi_il, il_gov_yields, boi_rate, rental_market_il, reit_regulation]

  senior_housing:
    label: דיור מוגן
    drivers: [cbs_home_price_index, cpi_il, il_gov_yields, senior_housing_regulation]

  construction_infra:
    label: קבלנות ותשתיות
    drivers: [gov_infra_budget, infra_tenders, steel, building_inputs_index,
              construction_labor, crude_oil]

  industrials_plastics:
    label: תעשיית פלסטיק ופולימרים
    drivers: [crude_oil, polymers, fx_usd_ils, fx_eur_ils, shipping_freight,
              global_industrial_demand]

  nonwovens:
    label: בדים לא ארוגים
    inherits: industrials_plastics
    drivers_extra: [polypropylene, hygiene_demand, china_competition]

  building_products:
    label: מוצרי בנייה וגמר
    drivers: [cbs_building_starts, building_inputs_index, renovation_demand,
              shipping_freight, fx_usd_ils]

  food_agri:
    label: מזון וחקלאות
    drivers: [soft_commodities, fx_eur_ils, fx_usd_ils, shipping_freight, cpi_il,
              food_regulation_il]

  defense_industry:
    label: תעשייה ביטחונית
    drivers: [defense_budgets, steel, fx_usd_ils]

  auto_components:
    label: רכיבי רכב
    drivers: [global_auto_production, ev_transition, fx_usd_ils, fx_eur_ils]

  tech_us:
    label: טכנולוגיה — נסחרות בארה"ב
    drivers: [nasdaq_sentiment, us10y, fx_usd_ils, sector_specific_news]

  holdings_credit:
    label: אחזקות / אשראי / אחר
    drivers: [il_gov_yields, credit_spreads, nav_discount]

