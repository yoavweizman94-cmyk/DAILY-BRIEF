# companies.yaml — FOREST Daily Brief
# גרסה 0.2 · 2026-08-03 · מקור: רשימה ידנית מיואב (94 שמות → 82 פעילות, 12 מוחרגות)
#
# עקרונות:
# 1. דרייברים מוגדרים ברמת סקטור (sector_profiles) — לחברה מוסיפים רק drivers_extra ספציפיים.
# 2. tase_id נשאר null בכוונה — ימולא ע"י סקריפט resolver מול TASE/מאיה. לא מנחשים מספרי נייר.
#    ה-resolver הוא גם בקרת האיכות: שם שלא נמצא ב-TASE = שגיאה שמדווחת, לא מתעלמים.
# 3. aliases — שמות חלופיים בעברית/אנגלית לצורך התאמת חדשות (news matching).
# 4. generic_name: true — שם שהוא גם מילה עברית רגילה. התאמה רק עם גבולות מילה ובהקשר עסקי.

