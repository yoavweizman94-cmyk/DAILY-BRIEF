<section class="auth">
  <h1>החשבון שלי</h1>
  <p class="auth-sub" id="who">טוען…</p>

  <form id="pf" autocomplete="on">
    <label>סיסמה נוכחית
      <input type="password" id="pc" required autocomplete="current-password"></label>
    <label>סיסמה חדשה
      <input type="password" id="pn" required minlength="10" autocomplete="new-password"></label>
    <label>אימות סיסמה חדשה
      <input type="password" id="pn2" required minlength="10" autocomplete="new-password"></label>
    <button type="submit" id="pb">החלף סיסמה</button>
  </form>

  <div id="pm" class="msg" role="status" aria-live="polite"></div>

  <p class="auth-note"><a href="/api/logout">יציאה מהחשבון</a></p>
</section>

<!-- נטען רק לבעלים; לכל שאר המשתמשים הנתיב מחזיר 403 והסעיף נשאר מוסתר. -->
<section class="auth pend" id="pend" hidden>
  <h2>בקשות גישה ממתינות</h2>
  <p class="auth-sub" id="pendsub">טוען…</p>
  <div id="pendlist"></div>
  <p class="pend-when" id="pendfoot" hidden></p>
</section>

<script>
(function () {
  "use strict";
  var f = document.getElementById("pf"), msg = document.getElementById("pm"),
      btn = document.getElementById("pb"), who = document.getElementById("who");

  function say(t, c) { msg.className = "msg " + (c || ""); msg.textContent = t; }

  fetch("/api/me").then(function (r) { return r.json(); }).then(function (d) {
    who.textContent = d && d.authenticated
      ? "מחובר כ-" + d.email
      : "לא מחובר.";
  }).catch(function () { who.textContent = ""; });

  // **הרשימה היא המקור, המייל הוא רק התראה עליו.** ערוץ יחיד שנכשל
  // בשקט אינו ערוץ; ב-26/08/2026 אדם נרשם ולא הגיעה הודעה, ולברר זאת
  // דרש הרצת workflow וקריאת לוג.
  var pend = document.getElementById("pend"),
      psub = document.getElementById("pendsub"),
      plist = document.getElementById("pendlist");

  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // **הרשימה היא נתיב האישור, לא המייל.** ההתראה במייל נכשלה שוב ושוב
  // — Resend החזיר 200 והודעה לא הגיעה — ובכל פעם בקשת גישה נעלמה בלי
  // עקבות. כאן היא נקראת מהמקור בכל רענון, והאישור נעשה מתוכה.
  //
  // **האישור אינו נתיב חדש.** הוא פונה לאותה נקודה חתומה ב-HMAC שאליה
  // הפנה הקישור במייל, רק בבקשת JSON במקום ניווט לדף. אותה בדיקת חתימה,
  // אותה חסימה של כתובת הבדיקה — רק בלי לצאת מהעמוד.
  var pfoot = document.getElementById("pendfoot"), ptimer = null, pbusy = false;

  function stamp(t) {
    pfoot.hidden = false;
    pfoot.textContent = "עודכן " + t.toLocaleTimeString("he-IL", {
      hour: "2-digit", minute: "2-digit" }) + " · מתרענן אוטומטית";
  }

  function approve(url, btn) {
    if (pbusy) return;
    pbusy = true;
    btn.disabled = true;
    var was = btn.textContent;
    btn.textContent = "מאשר…";
    // json=1 מבקש תשובת JSON מאותה נקודה בדיוק.
    fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "json=1",
          { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        pbusy = false;
        if (!res.ok) {
          btn.disabled = false;
          btn.textContent = was;
          psub.textContent = (res.d && (res.d.message || res.d.title)) || "האישור נכשל.";
          return;
        }
        load();
      })
      .catch(function () {
        pbusy = false;
        btn.disabled = false;
        btn.textContent = was;
        psub.textContent = "האישור נכשל — בדוק את החיבור ונסה שוב.";
      });
  }

  function render(d) {
    pend.hidden = false;
    stamp(new Date());
    if (!d.pending || !d.pending.length) {
      psub.textContent = "אין בקשות ממתינות.";
      plist.innerHTML = "";
      return;
    }
    psub.textContent = d.count + (d.count === 1 ? " בקשה ממתינה" : " בקשות ממתינות") + " לאישור.";
    plist.innerHTML = d.pending.map(function (u, i) {
      var head = '<div class="pend-head"><b>' + esc(u.name || "ללא שם") + "</b>" +
                 '<span class="pend-mail">' + esc(u.email) + "</span>" +
                 (u.org ? '<span class="pend-org">' + esc(u.org) + "</span>" : "") +
                 (u.test ? '<span class="pend-test">חשבון בדיקה</span>' : "") + "</div>";
      var why = u.why ? '<p class="pend-why">' + esc(u.why) + "</p>" : "";
      var when = u.created
        ? '<p class="pend-when">נרשם ' + esc(String(u.created).slice(0, 16).replace("T", " ")) + "</p>"
        : "";
      // חשבון הבדיקה חסום להפעלה בצד השרת ממילא, ולכן אין לו כפתור.
      var act = u.approve
        ? '<p><button type="button" class="pend-go" data-i="' + i + '">אישור והפעלה</button></p>'
        : '<p class="pend-when">אין קישור אישור לחשבון הזה.</p>';
      return '<div class="pend-item">' + head + why + when + act + "</div>";
    }).join("");
    // הקישורים מוחזקים ב-JS ולא ב-DOM: הם חתומים, ואין סיבה שיישבו
    // ב-HTML שאפשר להעתיק ממנו בטעות.
    var btns = plist.querySelectorAll("button.pend-go");
    Array.prototype.forEach.call(btns, function (b) {
      b.addEventListener("click", function () {
        var u = d.pending[parseInt(b.getAttribute("data-i"), 10)];
        if (u && u.approve) approve(u.approve, b);
      });
    });
  }

  function load() {
    return fetch("/api/pending", { headers: { "Accept": "application/json" } })
      .then(function (r) {
        if (r.status === 401) return null;
        // **403 אינו "אין בקשות".** הסתרת הסעיף על כל סירוב היא מה שגרם
        // לכך שבקשת גישה נעלמה פעמיים בלי עקבות: מי שאינו מזוהה כבעלים
        // רואה בדיוק את מה שרואה מי שאין לו בקשות ממתינות.
        if (r.status === 403) return r.json().then(function (x) {
          return { denied: true, d: x };
        });
        return r.json();
      })
      .then(function (d) {
        if (!d) return;
        if (d.denied) {
          var i = d.d || {};
          pend.hidden = false;
          psub.textContent = i.ownerConfigured
            ? "רשימת בקשות הגישה מוצגת לבעלים בלבד (" + (i.ownerHint || "—") +
              "). אתה מחובר כ-" + (i.you || "—") + "."
            : "לא הוגדרה כתובת בעלים בשירות, ולכן אי אפשר להציג בקשות גישה.";
          if (ptimer) { clearInterval(ptimer); ptimer = null; }
          return;
        }
        render(d);
      })
      .catch(function () { /* רענון שנכשל אינו מוחק את מה שכבר מוצג */ });
  }

  load();
  // רענון תקופתי, ועוד אחד כשחוזרים ללשונית: בקשה שנרשמה בזמן שהעמוד
  // היה פתוח ברקע צריכה להופיע בלי טעינה מחדש.
  ptimer = setInterval(load, 45000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var cur = document.getElementById("pc").value,
        nx = document.getElementById("pn").value,
        nx2 = document.getElementById("pn2").value;
    if (nx.length < 10) { say("הסיסמה החדשה חייבת להיות באורך 10 תווים לפחות.", "err"); return; }
    if (nx !== nx2) { say("שתי הסיסמאות אינן זהות.", "err"); return; }
    btn.disabled = true; say("מחליף…", "wait");
    fetch("/api/password", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current: cur, next: nx }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.d && res.d.error) || "ההחלפה נכשלה");
        f.reset(); btn.disabled = false;
        say("הסיסמה הוחלפה. הסשן חודש.", "ok");
      })
      .catch(function (err) { btn.disabled = false; say(err.message, "err"); });
  });
})();
</script>
