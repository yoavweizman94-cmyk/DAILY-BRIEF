# gov.yaml — עמודי הרגולציה: 17 משרדים ורשויות שנוגעים בחברות הנסחרות.
#
# **המקור הוא ה-API הפתוח של gov.il**, לא גרידת עמודים: אוספי התוכן של האתר
# (collectors) קוראים ל-openapi-gc.digital.gov.il עם clientId ציבורי שכל דפדפן
# מקבל ב-https://www.gov.il/CollectorsWebApi/client-config.js. ingest/gov_pull.py
# קורא את ה-clientId משם בכל ריצה ולא שומר אותו בריפו — אם יתחלף, הוא יתעדכן.
# נמצא ב-05/10/2026 מתוך קוד האתר; נדרשת הכותרת Origin: https://www.gov.il,
# ובלעדיה ה-API עונה 500.
#
# **רשימת הגופים — מ-data.gov.il** (28/10/2026, לבקשת יואב): מתוך 61 הארגונים
# שם, אלה שההחלטות שלהם מזיזות שורה בדוחות של חברות נסחרות. רשות התחרות ורשות
# החשמל אינן ארגונים נפרדים ב-data.gov.il, ונוספו מ-gov.il. בנק ישראל ורשות
# ניירות ערך מפרסמים באתרים משלהם, מחוץ ל-API הזה.
#
# **office_id** — מ-API עמודי הנחיתה של gov.il:
#   openapi-gc.digital.gov.il/pub/cio/govil/rest/landingpage/v1/he/api/offices/get/<slug>
# עם clientId מ-www.gov.il/LandingpageWebApi/client-config.js. המזהה מופיע בתשובה
# בכתובות "OfficeId=...". ה-slug הוא החלק שב-url.
#
# שלושה סוגי אוסף לכל גוף (CollectorType ב-API):
#   news       — חדשות והודעות דוברות
#   policies   — החלטות, נהלים, רישיונות (policy, pmopolicy)
#   pubs       — פרסומים: שימועים, הודעות מנכ"ל, דוחות, מכרזים (reports, rfp,
#                publicsharing). "דרושים" (drushim) מושמט בכוונה — משרות.
#
# **about ו-examples נכתבים לקורא שאינו מכיר את הענף** — מה הגוף עושה, ואיך
# החלטה טיפוסית שלו מגיעה לחברה. בלי מספרים (אין להם מקור כאן) ובלי ייחוס
# לחברה מסוימת של חוזה או חשיפה שאינם כתובים בשום מקור — ברמת התפקיד בלבד.
#
# **החברות — רק מרשימת הכיסוי, בשמן המדויק ב-companies.yaml.** המנגנון (why)
# נכתב ברמת התפקיד ולא ברמת החברה: הוא אומר מה מזיז את התפקיד, לא מה התמהיל
# העסקי של חברה מסוימת. הסיקור כפוף לאותו כלל.

groups:
  - key: finance
    name: כספים, מיסוי ותחרות
  - key: realestate
    name: נדל"ן, קרקע ובנייה
  - key: energy
    name: אנרגיה וסביבה
  - key: transport
    name: תקשורת, תחבורה ותיירות
  - key: industry
    name: תעשייה, מזון ובריאות

offices:
  # ── כספים, מיסוי ותחרות ────────────────────────────────────────────────────
  - key: finance
    group: finance
    name: משרד האוצר
    page: gov-finance.html
    office_id: f41159c1-7867-41c3-bc0a-cbfe0da1bb1a
    url: https://www.gov.il/he/departments/ministry_of_finance/govil-landing-page
    datagov: mof
    about: >-
      קובע את תקציב המדינה ואת מדיניות המסים, מתכנן את התוכניות הממשלתיות לדיור
      ולתשתיות ומפרסם מכרזים ממשלתיים גדולים. החלטה של האוצר נוגעת לרוב בענף שלם
      בבת אחת — מס, תקציב או מסלול סבסוד — ולא בחברה אחת.
    examples:
      - "מס מיוחד על רווחי הבנקים: מס נוסף מקטין את הרווח הנקי של כל הבנקים, גם כשהפעילות עצמה לא השתנתה."
      - "תקציב לכבישים ולרכבות: כסף שמוקצה לפרויקט הופך בהמשך למכרזים, ומשם לצבר העבודות (עבודות שנחתמו וטרם בוצעו) של קבלני התשתית."
      - "שינוי בתוכנית דיור ממשלתית: היקף הדירות המוזלות והמחיר שלהן קובעים כמה דירות יזם ימכור במסלול ובאיזה רווח."
    roles:
      - role: בנקים
        why: מיסוי מיוחד על הבנקים, היטלים ותקנות שהאוצר מוביל — הם הרווח הנקי שנשאר לבעלי המניות.
        companies: [לאומי, פועלים, מזרחי טפחות, דיסקונט א, בינלאומי, פיבי, ירושלים]
      - role: קבלני תשתיות
        why: תקציבי פיתוח ומכרזי תשתית (כולל PPP — שותפות בין המדינה ליזם פרטי) — הם הצבר העתידי וקצב הביצוע.
        companies: [שיכון ובינוי, דניה סיבוס, אשטרום קבוצה, שפיר הנדסה, אורון קבוצה, אלקטרה, קיסטון אינפרא, אלומה תשתיות]
      - role: יזמי מגורים
        why: תוכניות דיור ממשלתיות, מיסוי ומדיניות סבסוד — הם הביקוש לדירות והמחיר שהיזם מקבל.
        companies: [דמרי, אזורים, אפריקה מגורים, ישראל קנדה, אקרו, לוזון רונסון, חג'ג', צרפתי, אלמוגים, שובל]
      - role: קמעונאות ויבוא
        why: מכסים, מע"מ ופטורים ביבוא — הם מחיר המוצר לצרכן והתחרות מול יבוא ישיר ואתרי חו"ל.
        companies: [שופרסל, רמי לוי, יוחננוף, ויקטורי, דיפלומט אחזקות, מקס סטוק, פוקס]

  - key: tax
    group: finance
    name: רשות המסים
    page: gov-tax.html
    office_id: c0d8ba69-e309-4fe5-801f-855971774a90
    url: https://www.gov.il/he/departments/israel_tax_authority/govil-landing-page
    datagov: taxes-authority
    about: >-
      גובה את המסים ומפרסמת חוזרים והחלטות שמפרשים את החוק: מס רכישה ומס שבח
      בעסקאות נדל"ן, מע"מ, מכס ומס קנייה על יבוא, ובלו על דלק. שינוי בשיעור או
      בפרשנות עובר ישירות למחיר שהלקוח משלם.
    examples:
      - "שינוי במס הרכישה על דירה נוספת: משקיע שמשלם יותר מס קונה פחות דירות, והביקוש ליזמים יורד."
      - "שינוי בפטור ממע\"מ על קנייה מאתרי חו\"ל: פטור רחב יותר מגדיל את התחרות של הרשתות בארץ מול אתרים כמו אמזון."
      - "שינוי במס הקנייה על רכב: המחיר לצרכן משתנה, ואיתו מספר המכוניות שהיבואן מוכר."
    roles:
      - role: יזמי מגורים ונדל"ן
        why: מס רכישה, מס שבח ומע"מ בעסקאות דירות — הם מחיר הדירה לקונה, ולכן הביקוש וקצב המכירות של היזם.
        companies: [דמרי, אזורים, אפריקה מגורים, ישראל קנדה, אקרו, לוזון רונסון, חג'ג', צרפתי, אלמוגים, שובל]
      - role: יבואני רכב
        why: מס קנייה ומיסוי ירוק על רכב — הם המחיר לצרכן ומספר המכוניות שנמכרות.
        companies: [דלק רכב, קרסו מוטורס, יוניברסל מוטורס]
      - role: קמעונאות וצריכה
        why: מע"מ, מכס ופטור ביבוא אישי — הם המחיר על המדף מול חנויות האינטרנט בחו"ל.
        companies: [שופרסל, רמי לוי, פוקס, קסטרו, גולף, טרמינל איקס, המשביר 365, דיפלומט אחזקות]
      - role: דלקים
        why: הבלו על הדלק (מס קבוע על כל ליטר) — הוא חלק גדול ממחיר הדלק בתחנה ומשפיע על הביקוש.
        companies: [פז אנרגיה, דור אלון, בזן]

  - key: capital
    group: finance
    name: רשות שוק ההון, ביטוח וחיסכון
    page: gov-capital.html
    office_id: 809fb74a-67c7-4c4b-a8ad-86dd24786117
    url: https://www.gov.il/he/departments/capital_market_authority/govil-landing-page
    datagov: cma
    about: >-
      הרגולטור של חברות הביטוח, קרנות הפנסיה וקופות הגמל, ושל נותני אשראי חוץ-בנקאי
      (חברות הלוואות שאינן בנק). היא קובעת כמה הון חברה חייבת להחזיק, כמה מותר
      לגבות בדמי ניהול ואילו מוצרים מותר למכור.
    examples:
      - "דרישת הון מחמירה: חברת ביטוח שצריכה להחזיק יותר הון מול הסיכונים שלה יכולה לחלק פחות דיבידנד."
      - "תקרה לדמי הניהול בפנסיה: דמי ניהול נמוכים יותר הם הכנסה נמוכה יותר לחברה שמנהלת את הקרן."
      - "כללים חדשים לנותני אשראי: חובת בדיקה מחמירה יותר של הלווה מאטה את קצב מתן ההלוואות."
    roles:
      - role: חברות ביטוח
        why: דרישות הון (סולבנסי), עתודות ופיקוח על מוצרים ותעריפים — הם הרווח וכושר חלוקת הדיבידנד.
        companies: [הפניקס, הראל השקעות, מגדל ביטוח, מנורה מב החז, כלל עסקי ביטוח, איילון, איידיאיי ביטוח, ווישור גלובלטק, ליברה]
      - role: בתי השקעות, גמל ופנסיה
        why: דמי ניהול מרביים, כללי השקעה ורישוי — הם ההכנסות על כל שקל מנוהל.
        companies: [מיטב השקעות, אלטשולר שחם פנ, מור השקעות, מור גמל פנסיה, אנליסט, איביאי בית השק]
      - role: אשראי חוץ-בנקאי ותשלומים
        why: רישוי נותני אשראי ושירותי תשלום, תקרות ריבית וחובות בדיקה — הם קצב הצמיחה ועלות הסיכון.
        companies: [מימון ישיר, נאוי, מניף, יעקב פיננסים, אסאר אקורד, מכלול מימון, מלרן, אופל בלאנס, שוהם ביזנס, ברקת, בלאקאדג', ישראכרט]

  - key: competition
    group: finance
    name: רשות התחרות
    page: gov-competition.html
    office_id: 51752c15-473a-4c15-959f-e719cb113529
    url: https://www.gov.il/he/departments/competition/govil-landing-page
    about: >-
      מאשרת או חוסמת מיזוגים, מכריזה על מונופולים ומפקחת עליהם, ואוכפת את האיסור
      על הסדרים כובלים (למשל תיאום מחירים בין מתחרים). כל מיזוג גדול של חברה נסחרת
      עובר דרכה.
    examples:
      - "אישור מיזוג בתנאים: הרשות יכולה לחייב את החברות למכור חלק מהעסק, וזה משנה את הכדאיות של העסקה."
      - "הכרזה על מונופול: חברה שהוכרזה מונופול כפופה למגבלות על המחירים והתנאים שהיא קובעת לספקים וללקוחות."
      - "עיצום על תיאום מחירים: מעבר לקנס עצמו, הפרסום עלול להוביל לתביעות ייצוגיות."
    roles:
      - role: קמעונאות מזון
        why: אישור רכישות סניפים ורשתות, ופיקוח על היחסים עם ספקים — הם קצב ההתרחבות ותנאי הקנייה.
        companies: [שופרסל, רמי לוי, יוחננוף, ויקטורי]
      - role: יצרני וספקי מזון
        why: הכרזות מונופול ומגבלות על הסדרים עם רשתות — הם חופש התמחור והמבצעים.
        companies: [שטראוס, תורפז, סוגת, מחלבות גד, וילי פוד]
      - role: תקשורת
        why: מיזוגים ושיתופי פעולה בין חברות התקשורת — הם מבנה השוק והתחרות על הלקוח.
        companies: [בזק, פרטנר, סלקום]
      - role: בנקים וכרטיסי אשראי
        why: פיקוח על עמלות, מיזוגים ועסקאות בין גופים פיננסיים — הם התחרות על הלקוח והכנסות העמלות.
        companies: [לאומי, פועלים, מזרחי טפחות, דיסקונט א, ישראכרט]
      - role: אנרגיה ודלקים
        why: אישור עסקאות בשוק הגז והדלק והגבלות על ריכוזיות — הם מי רשאי לקנות מה, ובאיזה מחיר.
        companies: [ניו-מד אנרג יהש, דלק קבוצה, פז אנרגיה, דור אלון, בזן]

  # ── נדל"ן, קרקע ובנייה ────────────────────────────────────────────────────
  - key: housing
    group: realestate
    name: משרד הבינוי והשיכון
    page: gov-housing.html
    office_id: c515b1b2-3163-499e-bdbd-8849147c5ada
    url: https://www.gov.il/he/departments/ministry_of_construction_and_housing/govil-landing-page
    datagov: ministry_of_housing
    about: >-
      אחראי על תוכניות הדיור הממשלתיות: "דירה בהנחה" (דירות במחיר מוזל בהגרלה),
      שיווק קרקעות בשיתוף רמ"י, דיור להשכרה והתחדשות עירונית. היזמים הנסחרים
      מוכרים חלק מהדירות שלהם במסלולים האלה.
    examples:
      - "פתיחת הגרלה חדשה: יזם שזכה בקרקע במסלול דירה בהנחה יודע מתי יוכל למכור את הדירות ולמי."
      - "שינוי בתנאי המסלול ליזמים: תנאים פחות נוחים שוחקים את הרווח של היזם על כל דירה מוזלת."
      - "מסלול חדש להתחדשות עירונית: הקלה בתנאים מאפשרת ליזמים להתחיל יותר פרויקטים של פינוי-בינוי."
    roles:
      - role: יזמי מגורים
        why: מסלולי הדיור הממשלתיים, ההגרלות ותנאי המחיר המוזל — הם היקף המכירות, קצב השיווק והרווח לדירה.
        companies: [דמרי, אזורים, אפריקה מגורים, ישראל קנדה, אקרו, לוזון רונסון, חג'ג', צרפתי, אלמוגים, שובל, עמרם, פרשקובסקי, מגידו]
      - role: התחדשות עירונית
        why: מסלולי פינוי-בינוי, מענקים והקלות — הם הכלכליות של כל פרויקט והזמן עד שהוא יוצא לדרך.
        companies: [אאורה, הכשרה התחדשות, רותם שני, בית וגג, אב-גד]
      - role: דיור להשכרה
        why: מכרזי דירה להשכיר ותנאי השכירות הארוכה — הם ההכנסה השוטפת מהדירות.
        companies: [מגוריט, ריט אזורים ליוי]

  - key: land
    group: realestate
    name: רשות מקרקעי ישראל
    page: gov-land.html
    office_id: 806561c8-659a-4fbb-9b8f-8ecc1e6b8164
    url: https://www.gov.il/he/departments/israel_land_authority/govil-landing-page
    datagov: the_israel_lands_administration
    about: >-
      מנהלת את רוב הקרקע במדינה ומשווקת אותה במכרזים. היא קובעת את תנאי המכרזים
      למגורים, למסחר ולתעשייה, את דמי החכירה ואת דמי ההיתר (התשלום על שינוי ייעוד
      או תוספת בנייה בקרקע מדינה).
    examples:
      - "מכרז קרקע למגורים: מחיר הזכייה הוא עלות הקרקע של היזם, והוא קובע כמה ירוויח על כל דירה."
      - "שינוי בדמי ההיתר: דמי היתר גבוהים יותר מייקרים שינוי ייעוד — למשל הפיכת משרדים לדירות."
      - "הקצאת קרקע למתקנים סולאריים: יותר קרקע זמינה מאפשרת לחברות האנרגיה המתחדשת להקים עוד מתקנים."
    roles:
      - role: יזמי מגורים
        why: מכרזי הקרקע ותנאיהם — הם עלות הקרקע, הרווח לדירה וגודל העתודה העתידית.
        companies: [דמרי, אזורים, אפריקה מגורים, ישראל קנדה, אקרו, לוזון רונסון, חג'ג', צרפתי, אלמוגים, שובל, עמרם, פרשקובסקי, מגידו]
