# gov.yaml — עמודי הרגולציה: משרד התקשורת, רשות החשמל ומשרד התחבורה.
#
# **המקור הוא ה-API הפתוח של gov.il**, לא גרידת עמודים: אוספי התוכן של האתר
# (collectors) קוראים ל-openapi-gc.digital.gov.il עם clientId ציבורי שכל דפדפן
# מקבל ב-https://www.gov.il/CollectorsWebApi/client-config.js. ingest/gov_pull.py
# קורא את ה-clientId משם בכל ריצה ולא שומר אותו בריפו — אם יתחלף, הוא יתעדכן.
# נמצא ב-05/10/2026 מתוך קוד האתר; נדרשת הכותרת Origin: https://www.gov.il,
# ובלעדיה ה-API עונה 500.
#
# שלושה סוגי אוסף לכל גוף (CollectorType ב-API):
#   news       — חדשות והודעות דוברות
#   policies   — החלטות, נהלים, רישיונות (policy, pmopolicy)
#   pubs       — פרסומים: שימועים, הודעות מנכ"ל, דוחות, מכרזים (reports, rfp,
#                publicsharing). "דרושים" (drushim) מושמט בכוונה — משרות.
#
# **החברות — רק מרשימת הכיסוי, לפי הסיווג שלה ב-companies.yaml.** המנגנון
# (why) נכתב ברמת התפקיד ולא ברמת החברה: הוא אומר מה מזיז את התפקיד, לא מה
# התמהיל העסקי של חברה מסוימת. הסקירה כפופה לאותו כלל.

offices:
  - key: communications
    name: משרד התקשורת
    page: gov-communications.html
    office_id: 503be068-3051-4dc0-bc61-65f0b33f0570
    url: https://www.gov.il/he/departments/ministry_of_communications/govil-landing-page
    roles:
      - role: תשתית קווית וסיטונאות
        why: מחירי השוק הסיטונאי, חובות פריסת הסיבים והכיסוי, ותנאי הרישיון — הם הכנסות התשתית והמרווח של מי שמחזיק אותה, והעלות של מי שקונה ממנה.
        companies: [בזק]
      - role: סלולר, אינטרנט וטלוויזיה
        why: תדרים, חובות כיסוי ואיכות שירות, וקניית שירותים סיטונאיים מהתשתית — עלויות ההשקעה וההפעלה, ותנאי התחרות על הלקוח.
        companies: [פרטנר, סלקום]
      - role: לוויין ותקשורת מסחרית
        why: רישוי, תדרים ומכרזים — הם זמינות השוק המקומי ועלות הכניסה אליו.
        companies: [גילת טלקום, חלל תקשורת]
      - role: מדיה ותקשורת — אחר
        why: רגולציית תקשורת ושידורים כללית; קשר לחברה רק כשהפרסום נוגע בתחום הפעילות שלה במפורש.
        companies: [תיא השקעות]

  - key: electricity
    name: רשות החשמל
    page: gov-electricity.html
    office_id: c1d2ec1c-7f78-4d96-a739-1ed90f9e2b4b
    url: https://www.gov.il/he/departments/the_electricity_authority/govil-landing-page
    roles:
      - role: יצרני חשמל וספקים (קונבנציונלי ומעורב)
        why: תעריפים, מחיר השוק (SMP), רישוי, ערבויות ואמות מידה לאספקה — הם מחיר המכירה, עלות ההון ותנאי הפעילות של יצרן פרטי וספק.
        companies: [או פי סי אנרגיה, קנון, משק אנרגיה, שוב אנרגיה, סופרגז פאוור]
      - role: אנרגיה מתחדשת ואגירה
        why: מכסות, תעריפים למתקנים, הסדרי חיבור לרשת, שימועים על הפחתת תעריף או תמרוץ — הם הכנסות המתקנים, לוח הזמנים לחיבור ועלות ההקמה.
        companies: [אנלייט אנרגיה, אורמת טכנו, דוראל אנרגיה, אנרג'יקס, נופר אנרג'י, אקונרג'י, סולאיר, זפירוס, פריים אנרג'י, טראלייט, אלומיי, סאנפלאואר, אייראנג'י טק]
      - role: קלינטק ותשתיות אנרגיה
        why: הסדרי רשת, אגירה וטעינה — תנאי הכניסה לשוק החשמל של טכנולוגיות חדשות.
        companies: [ורידיס, אפולו פאוור, אלקטריאון]

  - key: transport
    name: משרד התחבורה
    page: gov-transport.html
    office_id: 48eaee91-0c97-4ef3-b364-50ae52e3b56f
    url: https://www.gov.il/he/departments/ministry_of_transport_and_road_safety/govil-landing-page
    roles:
      - role: יבואני רכב
        why: דרישות יבוא, תקינה ורישוי של דגמים, ומיסוי ירוק — הם אילו דגמים מותר להביא, באיזו עלות ובאיזה לוח זמנים.
        companies: [קרסו מוטורס, דלק רכב, יוניברסל מוטורס]
      - role: ליסינג והשכרה
        why: רישוי, תקינה וכללי בטיחות לציי רכב — עלות הצי וערך השייר שלו.
        companies: [אלדן תחבורה]
      - role: רכיבי רכב
        why: תקינה ודרישות חובה לרכב — מה נדרש מרכיבים בשוק המקומי.
        companies: [רבל]
      - role: תעופה
        why: החלטות רשות התעופה האזרחית, הסכמי תעופה, היתרי הפעלה ואגרות — קווים, תחרות ועלויות של חברת תעופה.
        companies: [אל על, ישראייר גרופ, כנפיים]
      - role: תשתיות תחבורה
        why: מכרזים ותוכניות לרכבת, כבישים ותחבורה ציבורית — הם הצבר העתידי של קבלני התשתית.
        companies: [שיכון ובינוי, דניה סיבוס, אשטרום קבוצה, שפיר הנדסה, אורון קבוצה]
      - role: נמלים ושילוח
        why: תעריפי נמל, רגולציית שילוח ותפעול נמלים — עלות ושירות לשרשרת היבוא.
        companies: [פרידנזון]

# רעש שאינו פרסום רגולטורי. נבדק מול 05/10/2026: במשרד התחבורה הפרסומים
# האחרונים היו הודעות לימאים באנגלית ומשרות.
exclude:
  types: [דרושים, מכרזי כוח אדם, משרות]
  title_patterns:
    - "למשרת"
    - "משרות פנויות"
    - "הודעה לימאים"
    - "(?i)^subject:"
    - "(?i)underwater"
    - "(?i)buoy"
    - "(?i)notice to mariners"

# איסוף: עד כמה אחורה בריצה הראשונה, וכמה פריטים בכל קריאה.
backfill_days: 45
page_size: 40
retention_days: 180
