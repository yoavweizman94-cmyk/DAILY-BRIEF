# חוזים עתידיים ב-yfinance: שורש, בורסה, חודשי החוזה הנסחרים (קודי חודש).
curves:
  - {root: CL, suffix: NYM, label: "נפט WTI",           months: "FGHJKMNQUVXZ", unit: "USD/Bbl"}
  - {root: BZ, suffix: NYM, label: "נפט ברנט",          months: "FGHJKMNQUVXZ", unit: "USD/Bbl"}
  - {root: NG, suffix: NYM, label: "גז Henry Hub",      months: "FGHJKMNQUVXZ", unit: "USD/MMBtu"}
  - {root: HG, suffix: CMX, label: "נחושת COMEX",       months: "HKNUZ",        unit: "USD/Lbs"}
  - {root: ZW, suffix: CBT, label: "חיטה CBOT",         months: "HKNUZ",        unit: "USc/Bu"}
  - {root: ZC, suffix: CBT, label: "תירס CBOT",         months: "HKNUZ",        unit: "USc/Bu"}
  - {root: ZS, suffix: CBT, label: "סויה CBOT",         months: "FHKNQUX",      unit: "USc/Bu"}
  - {root: KC, suffix: NYB, label: "קפה ערביקה",        months: "HKNUZ",        unit: "USc/Lbs"}
  - {root: SB, suffix: NYB, label: "סוכר 11",           months: "HKNV",         unit: "USc/Lbs"}
  - {root: CC, suffix: NYB, label: "קקאו",              months: "HKNUZ",        unit: "USD/T"}
curve_horizons: [3, 6, 12, 24]

# הבנק העולמי, Pink Sheet חודשי. col — שם העמודה בגיליון "Monthly Prices"; desc —
# תחילת התיאור הרשמי בגיליון "Description", שמוצג בעמוד. האזור לפי אותו תיאור
# (נבדק 17/09/2026: האשלג עבר מוונקובר לברזיל ב-2020, האוריאה למזרח התיכון ב-2022).
worldbank:
  landing: "https://www.worldbank.org/en/research/commodity-markets"
  months: 36
  series:
    - {col: "Potassium chloride **",       key: potash,   group: fertilizers, label: "אשלג (KCl)",     region: "ברזיל CFR", desc: "Potassium chloride (muriate of potash)"}
    - {col: "DAP",                         key: dap,      group: fertilizers, label: "DAP",            region: "מפרץ ארה\"ב FOB", desc: "DAP (diammonium phosphate)"}
    - {col: "TSP",                         key: tsp,      group: fertilizers, label: "TSP",            region: "יבוא למפרץ ארה\"ב", desc: "TSP (triple superphosphate)"}
    - {col: "Urea ",                       key: urea,     group: fertilizers, label: "אוריאה",         region: "המזרח התיכון FOB", desc: "Urea, (Ukraine)"}
    - {col: "Phosphate rock",              key: rock,     group: fertilizers, label: "סלע פוספט",      region: "צפון אפריקה FOB", desc: "Phosphate rock"}
    - {col: "Natural gas, Europe",         key: gas_eu,   group: energy,      label: "גז טבעי",        region: "אירופה (TTF)", desc: "Natural Gas (Europe)"}
    - {col: "Natural gas, US",             key: gas_us,   group: energy,      label: "גז טבעי",        region: "ארה\"ב (Henry Hub)", desc: "Natural Gas (U.S.)"}
    - {col: "Liquefied natural gas, Japan", key: lng_jp,  group: energy,      label: "LNG",            region: "יפן (יבוא CIF)", desc: "Liquefied natural gas (Japan)"}
    - {col: "Crude oil, Brent",            key: brent,    group: energy,      label: "נפט",            region: "ברנט", desc: "Crude oil, UK Brent"}
    - {col: "Crude oil, Dubai",            key: dubai,    group: energy,      label: "נפט",            region: "דובאי", desc: "Crude oil, Dubai"}
    - {col: "Coal, Australian",            key: coal_au,  group: energy,      label: "פחם תרמי",       region: "אוסטרליה", desc: "Coal (Australia), from"}
    - {col: "Coal, South African **",      key: coal_za,  group: energy,      label: "פחם תרמי",       region: "דרום אפריקה", desc: "Coal (South Africa), from"}
    - {col: "Aluminum",                    key: alu,      group: metals,      label: "אלומיניום",      region: "LME", desc: "Aluminum (LME)"}
    - {col: "Copper",                      key: copper,   group: metals,      label: "נחושת",          region: "LME", desc: "Copper (LME)"}
    - {col: "Iron ore, cfr spot",          key: ironore,  group: metals,      label: "עפרת ברזל",      region: "סין CFR", desc: "Iron ore (any origin)"}
    - {col: "Wheat, US SRW",               key: wheat,    group: agri,        label: "חיטה SRW",       region: "מפרץ ארה\"ב", desc: "Wheat (U.S.), no. 2, soft red"}
    - {col: "Maize",                       key: maize,    group: agri,        label: "תירס",           region: "מפרץ ארה\"ב", desc: "Maize (U.S.)"}
    - {col: "Palm oil",                    key: palm,     group: agri,        label: "שמן דקלים",      region: "מלזיה", desc: "Palm oil (Malaysia)"}
    - {col: "Sugar, world",                key: sugar,    group: agri,        label: "סוכר",           region: "עולמי", desc: "Sugar (World)"}
    - {col: "Coffee, Arabica",             key: arabica,  group: agri,        label: "קפה ערביקה",     region: "ICO", desc: "Coffee, Arabica"}
    - {col: "Cocoa",                       key: cocoa,    group: agri,        label: "קקאו",           region: "ICCO", desc: "Cocoa (ICCO)"}
  # הגרף החודשי בעמוד: הדשנים — אשלג, פוספטים ואוריאה.
  chart: [potash, dap, urea, rock]

# החברות הנסחרות ותלותן בסחורות. side: producer — מחיר גבוה מיטיב; consumer —
# מחיר גבוה הוא עלות; margin — הרווח תלוי במרווח ולא במחיר. why הוא המנגנון,
# לא תיאור עסקי: אין כאן טענה על תמהיל שאינה בדיווחי החברות. המיפוי מבוסס על
# רשימת המעקב הענפית ב-CLAUDE.md, והשמות נבדקים מול companies.yaml בכל ריצה.
exposures:
  - key: fertilizers
    label: "אשלג, ברום ופוספטים"
    commodities: ["potash", "dap", "tsp", "rock", "UFB:COM", "UFI:COM", "SULF:COM"]
    news: ["potash", "bromine", "phosphate", "fertilizer"]
    groups:
      - {side: producer, why: "מחיר האשלג, הפוספטים והברום הוא מחיר המכירה של יצרן הדשנים והכימיקלים.",
         companies: ["איי.סי.אל", "חברה לישראל"]}
      - {side: consumer, why: "דשנים הם תשומה חקלאית: מחיר גבוה מייקר את עלות הגידול.",
         companies: ["מהדרין", "גן שמואל"]}
  - key: oil
    label: "נפט, גז וזיקוק"
    commodities: ["CO1:COM", "CL1:COM", "NG1:COM", "NGEU:COM", "LNGJKM:COM", "TECSI:IND", "HO1:COM", "XB1:COM"]
    news: ["crude", "gas", "lng", "refining"]
    groups:
      - {side: producer, why: "מחירי הנפט והגז, ובחלק מחוזי הגז הצמדה לברנט, קובעים את הכנסות השותפויות והמפיקות.",
         companies: ["ניו-מד אנרג יהש", "ישראמקו יהש", "תמר פטרוליום", "נאוויטס פטר יהש", "רציו יהש", "אנרג'יאן", "דלק קבוצה"]}
      - {side: margin, why: "בית זיקוק מרוויח מהמרווח בין מחירי המוצרים לנפט הגולמי, לא ממחיר הנפט עצמו.",
         companies: ["בזן", "בזא", "פז אנרגיה"]}
      - {side: consumer, why: "דלק סילוני הוא עלות מרכזית בתעופה, ומחירו נגזר ממחירי הנפט והתזקיקים.",
         companies: ["אל על", "ישראייר גרופ"]}
  - key: power
    label: "חשמל"
    commodities: ["DEUELEPRI:COM", "FRAELEPRI:COM", "ITAELEPRI:COM", "ESPELEPRI:COM", "GBRELEPRI:COM", "EECXM:IND", "NGEU:COM"]
    news: ["electricity"]
    groups:
      # המחירים כאן אירופיים, והמפה אינה אומרת מי מוכר היכן. עד 17/09/2026 נוסח המנגנון
      # כללי, והסקירה כתבה שכל שבע החברות "נהנות" ממחיר החשמל באירופה.
      - {side: producer, why: "מחיר החשמל הסיטונאי באירופה מזיז רק את מה שנמכר בשוק באותה מדינה — לא חשמל בחוזה ארוך (PPA) או בתעריף מוסדר. החשיפה של כל חברה תלויה במדינות שבהן היא מוכרת בשוק.",
         companies: ["אנלייט אנרגיה", "אנרג'יקס", "או פי סי אנרגיה", "נופר אנרג'י", "דוראל אנרגיה", "אורמת טכנו", "משק אנרגיה"]}
  - key: polymers
    label: "פולימרים"
    commodities: ["POL:COM", "PYL:COM", "PVC:COM", "STR:COM", "SBR:COM", "MOB:COM"]
    news: ["polymers"]
    groups:
      - {side: consumer, why: "מחירי הפוליאתילן, הפוליפרופילן וה-PVC הם חומר הגלם; השאלה היא אם המחיר עובר ללקוח ובאיזה פיגור.",
         companies: ["פלרם", "פלסאון תעשיות", "רימוני", "כפרית", "גולן תעשיות", "פולירם", "אבגול", "ספאנטק", "עלבד"]}
  - key: construction
    label: "פלדה, אלומיניום ועץ"
    commodities: ["HRC:COM", "JBP:COM", "SSC:COM", "SCO:COM", "LMAHDS03:COM", "AAL:COM", "LB1:COM", "KSP:COM"]
