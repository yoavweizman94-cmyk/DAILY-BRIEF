# ---------------------------------------------------------------------------
# עמוד הסחורות (commodities.html) — מחירים, אזורים, חוזים, חדשות וחברות.
#
# נאסף ע"י ingest/commodities_pull.py ומנותח ע"י scripts/analyze_commodities.py,
# בצנרת commodities-watch. התוצרים בריפו התוכן תחת output/commodities/.
#
# ארבעה מקורות, וכל אחד עונה על שאלה אחרת:
#   · Trading Economics (/markets/commodities, במנוי) — מחיר עדכני ושינוי יומי,
#     שבועי, חודשי ושנתי, ל-109 סחורות. זה ה"ספוט" של העמוד.
#   · yfinance — חוזים עתידיים לפי חודש אספקה. עקום החוזים אומר אם השוק מתמחר
#     מחסור עכשיו (בקוורדיישן) או עודף (קונטנגו).
#   · הבנק העולמי (Pink Sheet, חודשי) — מחירי ייחוס לפי אזור עם הגדרה רשמית:
#     אשלג בברזיל, DAP במפרץ ארה"ב, אוריאה במזרח התיכון, גז באירופה/ארה"ב/יפן.
#     זה המקור היחיד כאן לאשלג, שאינו ב-Trading Economics.
#   · כותרות — היצע וביקוש, מאקרו ועסקאות שנחתמו (Google News ו-RSS).
#
# **אזור מוצג רק כשהוא ידוע.** למחירי Trading Economics בלי אזור מפורש, יחידה
# ביואן (CNY) היא סימן שהמחיר סיני; אחרת האזור ריק ולא מנוחש.
# ---------------------------------------------------------------------------

groups:
