# ערים לסריקה יומית של עסקאות נדל"ן.
#
# החלוקה לאזורים אינה קישוט: תמונת המצב נקראת בהשוואה בין אזורים, ולכן
# כל עיר משויכת לאזור אחד והסטטיסטיקה מחושבת גם ברמת האזור.
#
# anchor הוא כתובת או שם יישוב שממנו נגזרות הקואורדינטות. עדיף מרכז
# מובהק על פני "שם העיר" לבדו, כי הנקודה קובעת אילו שכונות נסרקות.

regions:
  - key: dan
    label: גוש דן
    cities:
      - {name: תל אביב-יפו,  anchor: "אבן גבירול 68 תל אביב"}
      - {name: רמת גן,        anchor: "ביאליק 1 רמת גן"}
      - {name: גבעתיים,       anchor: "כצנלסון 50 גבעתיים"}
      - {name: בני ברק,       anchor: "ז'בוטינסקי 20 בני ברק"}
      - {name: חולון,         anchor: "סוקולוב 60 חולון"}
      - {name: בת ים,         anchor: "בלפור 20 בת ים"}
      - {name: פתח תקווה,     anchor: "חיים עוזר 20 פתח תקווה"}
      - {name: ראשון לציון,   anchor: "רוטשילד 40 ראשון לציון"}
      - {name: הרצליה,        anchor: "סוקולוב 40 הרצליה"}
      - {name: רמת השרון,     anchor: "סוקולוב 40 רמת השרון"}
      - {name: כפר סבא,       anchor: "ויצמן 100 כפר סבא"}
      - {name: רעננה,         anchor: "אחוזה 100 רעננה"}
      - {name: הוד השרון,     anchor: "דרך רמתיים 40 הוד השרון"}
      - {name: גבעת שמואל,    anchor: "בן גוריון 20 גבעת שמואל"}

  - key: south
    label: דרום
    cities:
      - {name: באר שבע,       anchor: "רגר 40 באר שבע"}
      - {name: אשדוד,         anchor: "הרצל 20 אשדוד"}
      - {name: אשקלון,        anchor: "הרצל 30 אשקלון"}
      - {name: קרית גת,       anchor: "העצמאות 40 קרית גת"}
      - {name: נתיבות,        anchor: "ירושלים 20 נתיבות"}
      - {name: אופקים,        anchor: "הרצל 20 אופקים"}
      - {name: דימונה,        anchor: "הרצל 20 דימונה"}
      - {name: ערד,           anchor: "יהודה 10 ערד"}
      - {name: שדרות,         anchor: "הרצל 20 שדרות"}

  - key: north
    label: צפון
    cities:
      - {name: חיפה,          anchor: "הרצל 20 חיפה"}
      - {name: קרית ביאליק,   anchor: "ירושלים 20 קרית ביאליק"}
      - {name: קרית אתא,      anchor: "העצמאות 40 קרית אתא"}
      - {name: קרית מוצקין,   anchor: "שדרות ויצמן 40 קרית מוצקין"}
      - {name: נהריה,         anchor: "הגעתון 40 נהריה"}
      - {name: עכו,           anchor: "בן עמי 20 עכו"}
      - {name: כרמיאל,        anchor: "נשיאי ישראל 20 כרמיאל"}
      - {name: עפולה,         anchor: "הנשיא 20 עפולה"}
      - {name: טבריה,         anchor: "הגליל 20 טבריה"}
      # Govmap עדיין רושם את העיר בשמה עד 2019. בלי האליאס כל עסקאותיה
      # נזרקות, והעיר מוצגת כריקה.
      - {name: נוף הגליל,     anchor: "מעלה יצחק 20 נוף הגליל", aliases: [נצרת עילית]}
      # נבדק 21/08/2026: הפוליגונים מדווחים dealscount>0 אך endpoint
      # העסקאות מחזיר 0 בכל dealType. פער במקור, לא בסריקה.
      - {name: קרית שמונה,    anchor: "תל חי 20 קרית שמונה"}

# כמה פוליגונים לשלוף לכל עיר. כל פוליגון מחזיר את **כל השכונה** שסביבו,
# ולכן מספר קטן מכסה עיר שלמה; יותר מזה רק מכפיל בקשות על אותן עסקאות.
polygons_per_city: 6

# חלון הזמן שנשמר. נתוני רשות המסים מפגרים כשישה שבועות אחרי מועד
# העסקה, ולכן חלון קצר מדי מציג "ירידה בהיקפים" שהיא רק פיגור בדיווח.
months_back: 18

# כמה חלקות מותר לבדוק בעיר עד שנמצאות שש פוריות. הבדיקה עצמה זולה
# (limit=1), ורק בערים דלילות היא מגיעה לתקרה.
max_probes_per_city: 40
