# companies.yaml — TLV TASE View
# גרסה 0.3 · 2026-08-26 · מקור: רשימת הכיסוי המעודכנת של יואב (400 חברות)
#
# עקרונות:
# 1. דרייברים מוגדרים ברמת סקטור (sector_profiles). הפרופיל אינו תווית — הוא
#    קובע במה החברה תלויה, וממנו נגזרים האייטמים העקיפים: ידיעה על מחיר חומר
#    גלם או מהלך רגולטורי שאינם מזכירים אף חברה בשם.
# 2. tase_id מגיע מהרשימה של יואב והוא הסמכות. maya_company_id **אינו** נגזר
#    ממנו — נמדד ש-44 מתוך 73 אינם tase_id//1000 — ולכן הוא נפתר מול מאיה
#    ע"י ingest/resolve_tase_ids.py. null פירושו טרם נפתר, לא 'אין'.
# 3. tase_sector הוא הסיווג הרשמי של הבורסה, נשמר לצד הפרופיל הפנימי כדי
#    שאפשר יהיה להצליב מול מקורות חיצוניים.
# 4. generic_name: true — שם שהוא גם מילה עברית רגילה או מונח שאול. התאמה
#    רק עם גבולות מילה ובהקשר עסקי מובהק.
# 5. drivers_catalog מכסה את הדרייברים של **הפרופילים**, שהם משותפים לסקטור
#    ולכל אחד מהם מקור נתונים. drivers_extra ברמת חברה הוא חופשי בכוונה:
#    אלה תלויות ספציפיות (למשל gear_components לעשות) שאין להן מקור נפרד,
#    ורישום שלהן בקטלוג היה ממציא להן "מקור" שאינו קיים.

