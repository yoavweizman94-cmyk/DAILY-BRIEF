# sources.yaml — FOREST Daily Brief
# פרמטרי מקורות לסקריפטי ה-ingest. הסוכן לא קורא מכאן — רק הסקריפטים.

meta:
  version: "0.1"
  updated: "2026-08-03"

params:
  timezone: Asia/Jerusalem
  lookback_hours: 24          # חלון ברירת מחדל לכל המקורות החדשותיים

# ---------------------------------------------------------------------------
# Feedly — דורש FEEDLY_TOKEN בסביבה
# stream_ids: ברירת המחדל היא כל הפידים של החשבון (global.all).
# אפשר לצמצם לקטגוריה ספציפית: "user/<userId>/category/<שם>"
# ---------------------------------------------------------------------------
feedly:
  api_base: https://cloud.feedly.com/v3
  # שמות קטגוריות (לא מזהים) — הסקריפט מתרגם מול /v3/categories.
  # לא global.all: הוא מושך גם פידים שאינם נוגעים לכיסוי ומטביע את הרלוונטי.
  stream_ids:
    - ישראל          # גלובס (נדל"ן, שוק ההון, בארץ, גלובלי) + TheMarker
    - סחורות         # תשומות ותעשייה — פולימרים, מלט, מתכות, שילוח, מזון, ביטחוני
    - Datacenter     # דרייבר של עזריאלי (data_centers)
    - Energy         # דרייבר של סולאראדג' ושל עלות החשמל למרכזי נתונים
    - Cloude         # טק אמריקאי — Check Point, WIX, אמדוקס, פייבר וכו'
  max_items_per_stream: 250   # מכסה פר-קטגוריה
  # אזהרה תפעולית: ה-API מוגבל ל-50 קריאות ליום לחשבון. ריצה יומית צורכת
  # כ-2+מספר הקטגוריות. חקירה ידנית מול ה-API מכלה את המכסה ומפילה את
  # הריצה של אותו יום (429) — להוסיף פידים דרך ממשק Feedly, לא דרך ה-API.

# ---------------------------------------------------------------------------
# Gmail — דורש GMAIL_CREDENTIALS בסביבה (JSON עם client_id/client_secret/refresh_token)
# ---------------------------------------------------------------------------
gmail:
  label: "ברייף"          # כל מה שמתויג ידנית נכנס תמיד
  max_messages: 150
  # שולחים שנמשכים אוטומטית גם בלי תיוג. זוהו בסריקת התיבה (08/2026) כמנויים
  # פעילים שנוגעים ליקום הכיסוי. הוספה כאן חוסכת תיוג ידני יומי.
  senders:
    - mailtase.co.il        # סוכן חכם מאיה — התראות על חברות נסחרות
    - mc.haaretz.com        # TheMarker + שיחת השוק של אסא ששון
    - calcalist.co.il       # כלכליסט
    - divenewsletter.com    # Construction / Utility / Facilities / Smart Cities / ESG / Cybersecurity Dive
    - ittnewsletter.com     # Data Center Knowledge — דרייבר של עזריאלי
    - e.economist.com       # מאקרו עולמי
    - newsletters.ft.com    # FT
    - nytimes.com           # NYT
    - news.bloomberg.com    # Bloomberg Markets Daily
    - stratechery.com       # ניתוח טק — רקע ל-tech_us

# ---------------------------------------------------------------------------
# מאיה — API ציבורי, ללא אימות. הסינון לפי tase_id מ-companies.yaml נעשה בסקריפט.
# ---------------------------------------------------------------------------
maya:
  api_base: https://mayaapi.tase.co.il/api
  page_limit: 10              # עד 10 עמודי דיווחים אחורה בחלון הזמן

# ---------------------------------------------------------------------------
# שווקים — BOI (שערים יציגים) + yfinance. הרשימה נגזרת מ-drivers_catalog.
# proxy: true = המדד הוא קירוב, לא המחיר הענפי עצמו — הסוכן מציין זאת בברייף.
# ---------------------------------------------------------------------------
markets:
  boi:
    api: https://boi.org.il/PublicApi/GetExchangeRates?asJson=true
    currencies: [USD, EUR]
  yfinance:
    - {key: brent,        ticker: "BZ=F",      label: "ברנט",                       group: energy}
    - {key: wti,          ticker: "CL=F",      label: "WTI",                        group: energy}
    - {key: aluminum,     ticker: "ALI=F",     label: "אלומיניום LME",              group: metals}
    - {key: steel_hrc,    ticker: "HRC=F",     label: "פלדה HRC (ארה\"ב)",          group: metals, proxy: true}
    - {key: wheat,        ticker: "ZW=F",      label: "חיטה",                       group: soft}
    - {key: corn,         ticker: "ZC=F",      label: "תירס",                       group: soft}
    - {key: soybean,      ticker: "ZS=F",      label: "סויה",                       group: soft}
    - {key: sugar,        ticker: "SB=F",      label: "סוכר",                       group: soft}
    - {key: cocoa,        ticker: "CC=F",      label: "קקאו",                       group: soft}
    - {key: milk_c3,      ticker: "DC=F",      label: "חלב Class III",              group: soft}
    - {key: dry_bulk,     ticker: "BDRY",      label: "הובלה ימית (BDRY, פרוקסי)",  group: shipping, proxy: true}
    - {key: us10y,        ticker: "^TNX",      label: "US 10Y",                     group: yields, transform: tnx_div10}
    - {key: sp500,        ticker: "^GSPC",     label: "S&P 500",                    group: indices}
    - {key: nasdaq,       ticker: "^IXIC",     label: "נאסד\"ק",                    group: indices}
    - {key: ta125,        ticker: "^TA125.TA", label: "ת\"א-125",                   group: indices}
    - {key: ta35,         ticker: "TA35.TA" ,  label: "ת\"א-35",                    group: indices}
  # תשואת ממשלתי שקלי 10ש: אין מקור חינמי יציב (BOI SDMX מסורבל, TASE בתשלום).
  # markets_pull כותב null + הערת מקור; הברייף מציג US10Y בלבד עד שיוגדר מקור.
  il_gov_10y:
    enabled: false
    note: "אין מקור חינמי אמין — לבחון BOI SDMX או נתוני TASE בהמשך"

