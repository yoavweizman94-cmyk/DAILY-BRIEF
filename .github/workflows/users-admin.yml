name: Users Admin

# ניהול משתמשי השירות. הטופס באתר יודע רק ליצור חשבון ממתין, וקישור
# האישור רק להפעיל אותו — כל השאר נעשה כאן.
on:
  # **הפעלה בדחיפת קובץ טריגר.** שיגור workflow מרחוק דורש אסימון
  # GitHub שאינו קיים בסביבה כאן, ודחיפה כן אפשרית. הקובץ מחזיק את
  # הפעולה, ובריצה מדחיפה נאכפת **רשימת פעולות קריאה בלבד** — שינוי
  # במצב של חשבון אדם נשאר בהפעלה ידנית ומכוונת.
  push:
    paths:
      - ".trigger/users-admin.json"
  workflow_dispatch:
    inputs:
      action:
        description: "פעולה"
        type: choice
        options: [list, show, activate, disable, delete, setpw, seed]
        default: list
      email:
        description: "כתובת (לכל פעולה חוץ מ-list)"
        required: false
        default: ""
      password:
        description: "סיסמה חדשה (ל-setpw / seed)"
        required: false
        default: ""
      name:
        description: "שם לתצוגה (רק ל-seed של חשבון חדש)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manage
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: b437bf78b9bc4f358b6d0b4a64e0ad94
          ACTION: ${{ inputs.action }}
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
          NAME: ${{ inputs.name }}
          EVENT: ${{ github.event_name }}
        run: |
          # GITHUB_ENV משפיע רק על שלבים הבאים, ולכן הערכים נטענים
          # לסביבה של השלב הזה עצמו.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            python3 scripts/users_args.py > /tmp/users.env
            set -a; . /tmp/users.env; set +a
            echo "מטריגר: ACTION=$ACTION EMAIL=${EMAIL:-—}"
          fi
          python3 scripts/users.py
