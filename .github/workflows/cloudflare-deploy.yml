name: Cloudflare Deploy

# פריסת האתר ל-Cloudflare Pages.
#
# בשלב הזה זה workflow נפרד ולא שינוי בצנרת הקיימת, בכוונה: הנתיב החדש
# נבדק בבידוד לפני שנוגעים במה שעובד. אחרי שהוא מוכח, הצעד הזה נכנס
# לשלושת ה-workflows במקום הפריסה ל-GitHub Pages.
on:
  workflow_dispatch: {}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem
  PROJECT: forest-brief

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install pyyaml markdown

      - name: Build site
        run: python site/build.py

      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # אידמפוטנטי: אם הפרויקט כבר קיים הפקודה נכשלת ואין בכך רע
          npx --yes wrangler@4 pages project create "$PROJECT" \
            --production-branch main 2>&1 | tail -3 || \
            echo "הפרויקט כנראה כבר קיים — ממשיכים"

      - name: Deploy
        id: dep
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site/dist \
            --project-name "$PROJECT" --branch main 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### האתר נפרס" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        run: 'echo "כתובת הפריסה - ${{ steps.dep.outputs.url }}"'
