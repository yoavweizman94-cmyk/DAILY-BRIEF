name: Daily Brief

# שלוש מהדורות ביום. cron של GitHub הוא UTC בלבד וישראל מזיזה שעון פעמיים בשנה,
# ולכן כל מהדורה מתוזמנת לשתי שעות UTC — קיץ (UTC+3) וחורף (UTC+2) — ו-run_daily.sh
# בוחר מהדורה לפי השעה המקומית בפועל ויוצא בשקט בשעה ה"שנייה".
# הבורסה עברה בינואר 2026 למסחר שני–שישי; מהדורת הנעילה רצה רק בימי מסחר.
on:
# התזמון הופסק ב-24/08/2026 לחיסכון בעלות API והוחזר ב-25/08/2026
# לבקשת יואב, שביקש שהאתר יתעדכן שוב מעצמו בכל ההיבטים.
  schedule:
    - cron: "45 3,4 * * *"        # 06:45 ישראל — מהדורת בוקר, כל יום
    - cron: "0 15,16 * * 1,2,3,4" # 18:00 ישראל — נעילה, שני–חמישי (מסחר עד 17:14)
    - cron: "30 11,12 * * 5"      # 14:30 ישראל — נעילה בשישי (מסחר עד 13:34)
    - cron: "0 21,22 * * *"       # 00:00 ישראל — מהדורת לילה, כל יום
    #
    # **פעימות השלמה.** ריצה מתוזמנת שנכשלה — יתרה שאזלה, מקור שנפל,
    # ריצה ש-GitHub דילג עליה תחת עומס — לא נתפסה על ידי דבר, והאתר
    # נשאר עם הברייף של אתמול. נמדד ב-27/08: ריצת הלילה נכשלה על
    # היתרה, מהדורת הבוקר לא רצתה כלל, ולא היה יום.
    #
    # הפעימות האלה כמעט חינם: run_daily יוצא מיד כשהברייף של המהדורה
    # כבר קיים, בלי לגעת ב-API. הן עולות רק כשבאמת חסר משהו.
    - cron: "30 6,7 * * *"        # 09:30 ישראל — השלמה למהדורת הבוקר
    - cron: "0 18,19 * * 1,2,3,4" # 21:00 ישראל — השלמה למהדורת הנעילה
    - cron: "0 1,2 * * *"         # 04:00 ישראל — השלמה למהדורת הלילה
  # **הפעלה בדחיפת קובץ טריגר.** שיגור workflow מרחוק דורש אסימון
  # GitHub שאינו קיים בסביבת העבודה כאן; דחיפה כן אפשרית. הפרמטרים
  # נקראים מהקובץ — ראה scripts/brief_args.py.
  push:
    paths:
      - ".trigger/daily-brief.json"
  workflow_dispatch:
    inputs:
      edition:
        description: "מהדורה (morning / close / night). ריק = לפי השעה"
        required: false
        default: ""
      reviews:
        description: "כמה סקירות דוחות לכתוב בריצה (0 = בלי, ריק = 12)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  brief:
    runs-on: ubuntu-latest
    # הועלה מ-45: המהדורה מפיקה כעת עד 12 סקירות דוחות, וכל אחת היא
    # קריאה עם PDF מלא. חסם קצר היה הופך את זה לריצות שנקטעות.
    timeout-minutes: 120
    outputs:
      produced: ${{ steps.pipeline.outputs.produced }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ריפו התוכן הפרטי משוכפל אל output/, כך שכל הסקריפטים ממשיכים לעבוד
      # על אותם נתיבים בעוד המחקר עצמו כבר אינו בריפו הציבורי.
      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      # הפרמטרים מוכרעים במקום אחד, כי לשלושת האירועים מקורות שונים
      # ולאירוע push אין inputs כלל.
      - name: Resolve arguments
        env:
          IN_EDITION: ${{ inputs.edition }}
          IN_REVIEWS: ${{ inputs.reviews }}
        run: |
          python scripts/brief_args.py > /tmp/brief.env
          cat /tmp/brief.env >> "$GITHUB_ENV"
          cat /tmp/brief.env

      # המהדורה נגזרת מביטוי ה-cron שהפעיל את הריצה, לא משעת הביצוע בפועל.
      # ב-12/08/2026 ריצת הבוקר (cron 03:45 UTC) יצאה לפועל רק ב-05:19 UTC —
      # איחור של 94 דקות מצד GitHub — ואז השעה המקומית הייתה 08:19, מחוץ
      # לחלון "בוקר" ב-run_daily.sh, והברייף לא הופק בלי שאיש ידע. ביטוי
      # ה-cron ידוע מראש ואינו מושפע מעומס או משעון קיץ.
      - name: Resolve edition
        id: ed
        run: |
          case "${{ github.event.schedule }}" in
            "45 3,4 * * *"|"30 6,7 * * *")           ED=morning ;;
            "0 15,16 * * 1,2,3,4"|"30 11,12 * * 5"|"0 18,19 * * 1,2,3,4")
                                                     ED=close ;;
            "0 21,22 * * *"|"0 1,2 * * *")           ED=night ;;
            *)                                       ED="$BRIEF_EDITION_IN" ;;
          esac
          echo "edition=$ED" >> "$GITHUB_OUTPUT"
          echo "מהדורה: ${ED:-לפי השעה המקומית}"

      - name: Run daily pipeline
        id: pipeline
        env:
          BRIEF_EDITION: ${{ steps.ed.outputs.edition }}
          # הרצה ידנית תמיד מפיקה מחדש; מתוזמנת מדלגת אם כבר יש ברייף טרי
          BRIEF_FORCE: ${{ env.BRIEF_FORCE_IN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          TRADINGECONOMICS_KEY: ${{ secrets.TRADINGECONOMICS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ריצה מתוזמנת מגיעה בלי inputs; בלי ברירת המחדל כאן
          # אף מהדורה לא הייתה מפיקה סקירה מאז שהתזמון הוחזר.
          REVIEW_LIMIT: ${{ env.BRIEF_REVIEWS }}
          # Govmap חוסם את טווחי הענן של הראנרים; הסריקה עוברת דרך
          # Cloudflare Functions של האתר.
          GOVMAP_PROXY: https://app.tlvtaseview.com/api/govmap
          SCAN_KEY: ${{ secrets.SCAN_KEY }}
        run: |
          bash run_daily.sh
          # site/dist נוצר רק כשהופק ברייף; ריצת "skip" יוצאת לפני כן.
          if [ -d site/dist ]; then
            echo "produced=yes" >> "$GITHUB_OUTPUT"
          else
            # **ריצה ירוקה בלי ברייף היא הכשל המסוכן כאן.** היא נראית
            # מוצלחת, לא פורסת דבר, ואיש אינו מבחין שהאתר לא התעדכן.
            echo "::warning title=הריצה לא הפיקה ברייף::לא נוצר site/dist, ולכן לא נשמר תוכן ולא נפרס אתר. הסיבה באנוטציה שמעל."
            echo "produced=no" >> "$GITHUB_OUTPUT"
          fi

      # **עבודה ששולם עליה אינה נזרקת.** הסקירות נכתבות לפני הפקת הברייף,
      # ואם הברייף נופל — נגמר קרדיט, שגיאת מודל, timeout — הן היו הולכות
      # לאיבוד ונכתבות שוב בריצה הבאה, בתשלום נוסף. נמדד ב-24/08: שבע
      # סקירות אבדו כך בדיוק. הדחיפה כאן היא של התוכן בלבד; האתר אינו
      # נפרס, כי אין ברייף חדש להציג.
      - name: Salvage paid work when the pipeline failed
        if: failure()
        run: |
          CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}'             bash scripts/content_repo.sh push "תוצרים מריצה שנפלה" ||             echo "::warning::שמירת התוצרים נכשלה גם היא"

      - name: Commit state and output back to repo
        if: steps.pipeline.outputs.produced == 'yes'
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.sqlite data/calls_links.json data/offex_state.json data/nadlan_state.json data/otc_state.json
          git diff --cached --quiet || git commit -m "brief: $(date +'%F %H:%M')"
          bash scripts/git_sync.sh
          CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}' bash scripts/content_repo.sh push brief

      # פריסה ל-Cloudflare Pages. החליף את GitHub Pages, שאינו יודע לבקש
      # הזדהות בכלל — Cloudflare Access יושב לפני האתר וחוסם כברירת מחדל.
      - uses: actions/setup-node@v4
        if: steps.pipeline.outputs.produced == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.pipeline.outputs.produced == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail: בלי זה קוד היציאה הוא של tee ופריסה שנכשלה נראית ירוקה
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
