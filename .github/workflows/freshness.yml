name: Freshness

# משמר טריות: האם כל זרם נתונים התעדכן בזמן שהוא אמור.
#
# **למה זה קיים.** במשך יומיים יואב גילה בעצמו שדברים תקועים — ברייף של
# אתמול, עסקאות שלא זזו, תמלולים חסרים — ובכל פעם הריצות שהיו אמורות
# לייצר אותם היו ירוקות. ריצה מוצלחת אינה מבטיחה תוצר מעודכן: היא
# יכולה לצאת מוקדם, לדחוף לריפו התוכן בלי לפרוס, או להיכשל במקור בודד
# ולהמשיך. שלושת המקרים קרו כאן.
#
# הבדיקה היא על **התוצר** ולא על הריצה, ולכן היא תופסת גם כשל שאיש לא
# חשב עליו מראש. היא זולה — שכפול ריפו התוכן וקריאת קבצים, בלי API.
on:
  schedule:
    # **כל שעה.** יואב ביקש ב-28/08/2026 שהכל יהיה עדכני בקצב הזה,
    # והבדיקה זולה — שכפול ריפו התוכן וקריאת קבצים, בלי API בתשלום.
    # ההתראה נשלחת רק כשמשהו חורג, ולכן שעה שאין בה תקלה שקטה לגמרי.
    - cron: "15 * * * *"
  push:
    paths:
      - ".trigger/freshness.json"
  workflow_dispatch: {}

permissions:
  contents: read
  # נדרש כדי לשלוף את סיבת הכישלון מהריצה האחרונה של הצינור התקוע.
  # התראה שאומרת "תקוע" מחייבת חקירה; "תקוע כי היתרה אזלה" מחייבת
  # פעולה אחת.
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Install
        run: pip install --quiet requests truststore certifi

      # קובעת ואינה מדפיסה: זרם שחרג מהסף מפיל את הריצה, כדי שהיא
      # תופיע אדומה ברשימת ה-Actions ולא תיבלע כעוד ריצה ירוקה.
      #
      # **--alert הוא הלב.** האתר כבר מסמן "ברייף מאתמול", והבדיקה כבר
      # נכשלת אדום כאן — ובכל זאת, שלושה ימים ברציפות יואב הוא שגילה
      # שמשהו תקוע. ערוץ שדורש ממנו לפתוח דף כדי לדעת אינו התראה.
      # ההתראה יוצאת במייל, באותו נתיב Resend שכבר מוכח.
      - name: Check freshness
        env:
          # ההתראה נשלחת במייל דרך /api/alert של האתר, שמחזיק את מפתח
          # הדואר. SCAN_KEY כבר קיים בשני הצדדים ולכן אין סוד חדש.
          SCAN_KEY: ${{ secrets.SCAN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # לבדיקת מה נפרס בפועל: תוכן שנבנה אינו תוכן שמוגש, וכל
          # הכשלים שחזרו כאן ישבו בדיוק בפער הזה.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # ALERT_TEST=1 בקובץ הטריגר שולח הודעת בדיקה במקום הבדיקה
          # הרגילה — לאימות הנתיב מקצה לקצה.
          if [ "$(python -c "import json,pathlib;print(json.loads(pathlib.Path('.trigger/freshness.json').read_text(encoding='utf-8')).get('test',''))" 2>/dev/null)" = "1" ]; then
            python scripts/freshness.py --test-alert
          else
            python scripts/freshness.py --alert
          fi
