name: Site Check

# בדיקה חיצונית של מצב האתר. המחשב המקומי יושב מאחורי FortiGuard ארגוני
# שחוסם את הדומיין בקטגוריה "Newly Registered Domain" ומחזיר 403 על הכל —
# כלומר בדיקה מקומית אינה מבחינה בין אתר תקין לאתר מת. runner נקי כן.
#
# הבדיקה **קובעת** ואינה רק מדפיסה: ריצה ירוקה שמדפיסה מספרים שאיש אינו
# קורא היא בדיוק הכשל שהבדיקה הזו נועדה לתפוס.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 5 * * *"      # 08:20 שעון ישראל בקיץ

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        run: |
          fail=0
          note() { echo "  $*"; }
          bad()  { echo "::error::$*"; fail=1; }

          # --- האפקס והדומיין עם www: חייבים להגיש את דף הנחיתה הציבורי ---
          for h in tlvtaseview.com www.tlvtaseview.com; do
            echo "=== $h ==="
            : > p.html          # שלא ייווצר grep על קובץ חסר כשה-curl נופל
            code=$(curl -sL -o p.html --max-time 30 -w '%{http_code}' "https://$h/" || true)
            note "קוד סופי: $code"
            note "כותרת: $(grep -o '<title>[^<]*' p.html | head -1 | cut -c8-70)"
            [ "$code" = "200" ] || bad "$h החזיר $code במקום 200"
            for marker in 'id="req"' 'class="shot"' 'class="facts"'; do
              n=$(grep -o "$marker" p.html | wc -l)
              note "$marker × $n"
              [ "$n" -gt 0 ] || bad "$h — הסמן $marker חסר; זה אינו דף הנחיתה"
            done
            # דף נחיתה שמגיש בטעות את האפליקציה או מסך התחברות
            grep -qi 'cloudflareaccess\|Sign in ・' p.html && \
              bad "$h מגיש מסך התחברות במקום דף נחיתה"
          done

          # --- האפליקציה: חייבת להיות מוגנת. גישה חופשית כאן היא דליפת תוכן ---
          echo "=== app.tlvtaseview.com ==="
          : > a.html
          code=$(curl -sL -o a.html --max-time 30 -w '%{http_code}' "https://app.tlvtaseview.com/" || true)
          eff=$(curl -sL -o /dev/null --max-time 30 -w '%{url_effective}' "https://app.tlvtaseview.com/" || true)
          note "קוד: $code"
          note "יעד סופי: $eff"
          # ההגנה היא עכשיו שער הסשן של האפליקציה עצמה: בקשה בלי עוגייה
          # מופנית ל-/login. הביטוי מקבל גם הפניה ל-Cloudflare Access,
          # כדי שהבדיקה תישאר תקפה אם אי פעם תבוצע חזרה אליו.
          if echo "$eff" | grep -qE '/login|cloudflareaccess\.com'; then
            note "מוגן ✓"
          else
            bad "app.tlvtaseview.com אינו מוגן — הגיע ל-$eff עם קוד $code"
          fi
          # הוכחה חיובית שדף הכניסה עצמו באמת מוגש ולא מסך שגיאה
          if grep -q 'id="lf"' a.html; then
            note "דף הכניסה מוגש ✓"
          else
            bad "היעד אינו דף הכניסה — הטופס חסר"
          fi
          # הוכחה חיובית שהתוכן עצמו לא דלף
          grep -q 'class="toc"' a.html && bad "גוף הברייף הוגש ללא הזדהות — דליפה"

          # --- הנכסים שהוגשו הם באמת האחרונים ---
          # פריסה יכולה לחזור "success" ועדיין להגיש CSS ישן מהמטמון, וזה
          # בדיוק סוג הכשל שהבדיקה הזו קיימת בשבילו: העמוד נראה תקין,
          # הריצה ירוקה, והמבקר מקבל את העיצוב של אתמול.
          echo "=== נכסים עדכניים ==="
          if grep -q "Frank+Ruhl+Libre" p.html; then
            note "גופן הכותרות מקושר ✓"
          else
            bad "דף הנחיתה אינו טוען את Frank Ruhl Libre — הוגש HTML ישן"
          fi
          : > css.txt
          ccode=$(curl -sL -o css.txt --max-time 25 -w '%{http_code}' "https://tlvtaseview.com/style.css" || true)
          note "style.css → $ccode  ($(wc -c < css.txt) בתים)"
          if [ "$ccode" = "200" ] && grep -q -- "--on-accent" css.txt; then
            note "גיליון הסגנון עדכני ✓"
          else
            bad "style.css אינו מכיל --on-accent — נכס ישן מוגש (קוד $ccode)"
          fi

          # --- העמודים המוגנים קיימים ומוגשים דרך השער ---
          echo "=== עמודי האפליקציה ==="
          for pg in offex account login; do
            c=$(curl -sL -o /dev/null --max-time 25 -w '%{http_code}' "$APP/$pg.html" || true)
            note "$pg → $c"
            [ "$c" = "200" ] || bad "$APP/$pg.html החזיר $c"
          done

          # --- pages.dev: חייב להפנות לדומיין ולא להגיש בעצמו ---
          echo "=== forest-brief.pages.dev ==="
          rd=$(curl -s -o /dev/null --max-time 25 -w '%{redirect_url}' "https://forest-brief.pages.dev/" || true)
          note "הפניה: ${rd:-אין}"
          echo "$rd" | grep -q 'app\.tlvtaseview\.com' || \
            bad "pages.dev אינו מפנה ל-app.tlvtaseview.com (קיבלנו: ${rd:-אין})"

          echo
          [ "$fail" = "0" ] && echo "כל הבדיקות עברו." || echo "יש כשלים — ראו ::error:: למעלה."
          exit "$fail"

      - name: Pages domain status
        if: always()
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/forest-brief/domains" \
            | python3 -c "import json,sys;[print(f\"  {d['name']}: {d['status']} · אימות {d.get('validation_data',{}).get('status')}\") for d in json.load(sys.stdin).get('result',[])]"
