name: Site Check

# בדיקה חיצונית של מצב האתר. המחשב המקומי מאחורי פרוקסי ארגוני שחוסם
# את הבדיקות האלה, ו-runner נקי נותן תשובה אמינה.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe
        run: |
          for h in tlvtaseview.com www.tlvtaseview.com forest-brief.pages.dev; do
            echo "=== $h ==="
            curl -s -o /dev/null --max-time 25 -w '  קוד: %{http_code}   הפניה: %{redirect_url}\n' "https://$h/" || echo "  לא נגיש"
            curl -sL -o p.html --max-time 30 -w '  אחרי הפניות: %{http_code}   סופי: %{url_effective}\n' "https://$h/" || true
            echo "  אריחי שווקים: $(grep -c 'class="tile' p.html || true)"
            echo "  כותרת: $(grep -o '<title>[^<]*' p.html | head -1 | cut -c8-70)"
            for marker in 'id="req"' 'class="shot"' 'class="facts"' 'name="remail"' 'class="toc"'; do
              n=$(grep -o "$marker" p.html | wc -l)
              [ "$n" -gt 0 ] && echo "    $marker × $n"
            done
          done

      - name: Pages domain status
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/forest-brief/domains" \
            | python3 -c "import json,sys;[print(f\"  {d['name']}: {d['status']} · אימות {d.get('validation_data',{}).get('status')}\") for d in json.load(sys.stdin).get('result',[])]"
