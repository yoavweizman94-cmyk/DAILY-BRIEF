name: Dispatch Token Sync

# מעביר את האסימון שמפעיל ברייף בלחיצה מ-GitHub ל-Cloudflare Pages.
#
# הכפתור באתר רץ ב-Cloudflare, ושיגור ריצה מ-GitHub דורש אסימון שיושב שם.
# הוספתו בדשבורד דורשת למצוא מסך ששינה את שמו ("Variables and Secrets",
# לא "Environment variables"), ואת החיפוש הזה אפשר לחסוך: הסוד נוסף פעם
# אחת ב-GitHub → Settings → Secrets and variables → Actions, בשם
# **DISPATCH_TOKEN**, והריצה הזו מציבה אותו בפרויקט ה-Pages בשם
# GITHUB_DISPATCH_TOKEN.
#
# **שני שמות, ולא בטעות.** GitHub דוחה סוד ששמו מתחיל ב-GITHUB_, ולכן אצלו
# הוא DISPATCH_TOKEN; הפונקציה באתר קוראת env.GITHUB_DISPATCH_TOKEN, ולכן
# בצד Cloudflare זה השם. ההמרה נעשית כאן.
#
# הערך אינו מודפס ואינו נשמר בשום מקום אחר. האימות בסוף בודק שהשם קיים
# ושסוגו מוצפן, לא את ערכו.
#
# אחרי ההצבה: הפריסה הבאה (כל דחיפה ל-main) מרימה את האתר עם האסימון,
# ומאותו רגע לחיצה על "הפק" משגרת ריצה מיד במקום לחכות לתזמון של GitHub.
on:
  push:
    paths:
      - ".trigger/dispatch-token-sync.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dispatch-token-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/pages_env.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      # **האסימון נבדק לפני ההצבה.** אסימון fine-grained פג בתאריך שנקבע כשנוצר, ואז
      # הכפתור באתר נכשל בלי שום סימן כאן. הבדיקה מול GitHub מדפיסה את קוד התשובה ואת
      # תאריך התפוגה (הכותרת github-authentication-token-expiration) — לא את הערך.
      - name: Check the token
        env:
          T: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error title=אין DISPATCH_TOKEN::הסוד אינו מוגדר ב-GitHub"; exit 1; fi
          code=$(curl -s -o /dev/null -D h.txt -w "%{http_code}" -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-brief.yml")
          exp=$(grep -i '^github-authentication-token-expiration:' h.txt | cut -d' ' -f2- | tr -d '\r')
          rm -f h.txt
          echo "::notice title=אסימון ההפעלה::GitHub השיב $code · תפוגה: ${exp:-לא צוינה}"
          if [ "$code" != "200" ]; then
            echo "::error title=אסימון ההפעלה נדחה ($code)::צריך אסימון fine-grained חדש לריפו DAILY-BRIEF עם Actions: Read and write, שמור כסוד DISPATCH_TOKEN"
            exit 1
          fi

      - name: Put token into Pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAR_NAME: GITHUB_DISPATCH_TOKEN
          VAR_VALUE: ${{ secrets.DISPATCH_TOKEN }}
        run: python3 scripts/pages_env.py
