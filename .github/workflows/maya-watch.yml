name: Maya Watch

# ניטור רציף — כל רבע שעה, מסביב לשעון. חברות מדווחות גם אחרי הנעילה ובסופי
# שבוע, ולכן אין חלון "בטוח" לדלג עליו.
#
# עלות — נמדד 12–19/08/2026 (236 ריצות): הפיצול עובד. מחזורי לילה (00:00–07:00)
# מסתיימים ב-0.3 דקה בממוצע, וכל חלון הלילה עולה 25 דק'/שבוע בלבד; אין טעם
# לצמצם אותו. כל העלות בשעות היום — 704 דק'/שבוע, ממוצע 4.5 דק' למחזור.
#
# פילוח המחזור היקר: Summarize 293s, Install summarizer 26s, Deploy 20s,
# Collect 11s, Update index 8s, כל השאר <6s. כלומר 78% מהעלות הוא שלב הסיכום
# עצמו — עבודת מוצר, לא תקורה. אין כאן מה לייעל טכנית: הורדת העלות פירושה
# לסכם בתדירות נמוכה מרבע שעה, וזו החלטת מוצר על טריות מול עלות.
#
# הריפו פרטי, ולכן הדקות חיובות: ~4,580 דק'/חודש מול 2,000 כלולות.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maya-watch
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      new: ${{ steps.collect.outputs.new }}
      idx: ${{ steps.filings.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ריפו התוכן הפרטי משוכפל אל output/, כך שכל הסקריפטים ממשיכים לעבוד
      # על אותם נתיבים בעוד המחקר עצמו כבר אינו בריפו הציבורי.
      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      # רק מה שצריך לשלב הזיהוי. yfinance/google-api/pypdf אינם נדרשים כאן,
      # ו-pip מהמטמון מסיים בשניות. markdown נכלל כי מחזור שבו רק אינדקס
      # הדוחות השתנה בונה את האתר בלי לעבור בשלב ההתקנה המלא.
      - name: Install collector dependencies
        run: pip install curl_cffi pyyaml truststore certifi requests markdown

      - name: Collect new Maya reports
        id: collect
        run: |
          python ingest/maya_watch.py
          if python - <<'PY'
          import json, sys
          from datetime import date
          from pathlib import Path
          p = Path("data/raw") / date.today().isoformat() / "maya_new.jsonl"
          rows = [json.loads(l) for l in p.read_text(encoding="utf-8").splitlines() if l.strip()] if p.exists() else []
          pending = [r for r in rows if r.get("summarize")]
          done = set()
          d = p.with_name("maya_summaries.jsonl")
          if d.exists():
              done = {json.loads(l).get("id") for l in d.read_text(encoding="utf-8").splitlines() if l.strip()}
          sys.exit(0 if [r for r in pending if r["id"] not in done] else 1)
          PY
          then echo "new=yes" >> "$GITHUB_OUTPUT"; else echo "new=no" >> "$GITHUB_OUTPUT"; fi

      # אינדקס הדוחות מתעדכן בכל מחזור ולא רק כשיש מה לסכם: דוח כספי חדש שייך
      # לאינדקס גם אם אינו עובר את סף המהותיות לסיכום. השלב זול — 1–3 קריאות
      # API ובלי מודל — ולכן הוא רץ תמיד.
      - name: Update filings index
        id: filings
        run: |
          python ingest/maya_index.py --recent 2 || echo "אינדקס הדוחות נכשל — ייאסף במחזור הבא"
          if [ -n "$(git status --porcelain output/filings)" ]; then
            echo "idx=yes" >> "$GITHUB_OUTPUT"
          else
            echo "idx=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing new
        if: steps.collect.outputs.new != 'yes' && steps.filings.outputs.idx != 'yes'
        run: echo "אין דיווחים חדשים לסיכום ולא השתנה האינדקס — יוצאים בלי להתקין את ה-CLI."

      - uses: actions/setup-node@v4
        if: steps.collect.outputs.new == 'yes'
        with:
          node-version: "20"

      - name: Install summarizer
        if: steps.collect.outputs.new == 'yes'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Summarize
        if: steps.collect.outputs.new == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # כישלון כאן לא מפיל את הריצה — עדכון האינדקס והפריסה עדיין שווים.
          # אבל הוא חייב להיראות: "הסיכום נכשל" בגוף הלוג נבלע לגמרי, והריצה
          # נשארה ירוקה מ-18/08 בזמן שאף דיווח לא סוכם. אנוטציה צפה לראש
          # הריצה ולמסך ה-Actions, ולכן אי אפשר לפספס אותה.
          set +e
          python scripts/summarize_reports.py 2>&1 | tee sum.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            if grep -qi 'credit balance is too low\|insufficient.*credit\|quota' sum.log; then
              echo "::error title=יתרת Anthropic אזלה::סיכומי הדוחות אינם רצים והברייפים אינם נכתבים. טעינה: console.anthropic.com/settings/billing"
            else
              echo "::warning title=הסיכום נכשל (קוד $rc)::ייאסף במחזור הבא. הפירוט בשלב Summarize."
            fi
          fi
          exit 0

      - name: Commit summaries
        if: steps.collect.outputs.new == 'yes' || steps.filings.outputs.idx == 'yes'
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output/reports output/news
          python scripts/publish_reports.py || true
          git add data/state.sqlite data/maya_index_state.json
          git diff --cached --quiet || git commit -m "maya: $(date +'%F %H:%M')"
          bash scripts/git_sync.sh
          CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}' bash scripts/content_repo.sh push maya

      # בלי זה הסיכומים יושבים בריפו אבל האתר מציג אותם רק אחרי המהדורה הבאה —
      # עיכוב של עד שמונה שעות, שסותר את כל הרעיון של ניטור רציף.
      - name: Rebuild site
        if: steps.collect.outputs.new == 'yes' || steps.filings.outputs.idx == 'yes'
        run: python site/build.py

      # פריסה ל-Cloudflare Pages. החליף את GitHub Pages, שאינו יודע לבקש
      # הזדהות בכלל — Cloudflare Access יושב לפני האתר וחוסם כברירת מחדל.
      - uses: actions/setup-node@v4
        if: steps.collect.outputs.new == 'yes' || steps.filings.outputs.idx == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.collect.outputs.new == 'yes' || steps.filings.outputs.idx == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail: בלי זה קוד היציאה הוא של tee ופריסה שנכשלה נראית ירוקה
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
