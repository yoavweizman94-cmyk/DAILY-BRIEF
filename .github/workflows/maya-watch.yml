name: Maya Watch

# ניטור רציף — כל רבע שעה, מסביב לשעון. חברות מדווחות גם אחרי הנעילה ובסופי
# שבוע, ולכן אין חלון "בטוח" לדלג עליו.
#
# עלות: ריצה מלאה נמדדה ב-4.1 דקות, וב-96 ריצות ביום זה ~11,900 דקות בחודש —
# פי ארבעה מהמכסה הכלולה. לכן הריצה מפוצלת: שלב הזיהוי זול (checkout + pip
# מהמטמון), ורק אם נמצאו דיווחים חדשים מותקן ה-CLI ומופעל הסיכום. רוב המחזורים
# הלילייים מסתיימים בפחות מדקה.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maya-watch
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # רק מה שצריך לשלב הזיהוי. yfinance/google-api/pypdf אינם נדרשים כאן,
      # ו-pip מהמטמון מסיים בשניות.
      - name: Install collector dependencies
        run: pip install curl_cffi pyyaml truststore certifi requests

      - name: Collect new Maya reports
        id: collect
        run: |
          python ingest/maya_watch.py
          if python - <<'PY'
          import json, sys
          from datetime import date
          from pathlib import Path
          p = Path("data/raw") / date.today().isoformat() / "maya_new.jsonl"
          rows = [json.loads(l) for l in p.read_text(encoding="utf-8").splitlines() if l.strip()] if p.exists() else []
          pending = [r for r in rows if r.get("summarize")]
          done = set()
          d = p.with_name("maya_summaries.jsonl")
          if d.exists():
              done = {json.loads(l).get("id") for l in d.read_text(encoding="utf-8").splitlines() if l.strip()}
          sys.exit(0 if [r for r in pending if r["id"] not in done] else 1)
          PY
          then echo "new=yes" >> "$GITHUB_OUTPUT"; else echo "new=no" >> "$GITHUB_OUTPUT"; fi

      - name: Nothing new
        if: steps.collect.outputs.new != 'yes'
        run: echo "אין דיווחים חדשים לסיכום — יוצאים בלי להתקין את ה-CLI."

      - uses: actions/setup-node@v4
        if: steps.collect.outputs.new == 'yes'
        with:
          node-version: "20"

      - name: Install summarizer
        if: steps.collect.outputs.new == 'yes'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Summarize
        if: steps.collect.outputs.new == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize_reports.py || echo "הסיכום נכשל — ייאסף במחזור הבא"

      - name: Commit summaries
        if: steps.collect.outputs.new == 'yes'
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output/reports output/news
          python scripts/publish_reports.py || true
          git add data/state.sqlite output/reports
          git diff --cached --quiet || git commit -m "maya: $(date +'%F %H:%M')"
          git pull --rebase origin main && git push
