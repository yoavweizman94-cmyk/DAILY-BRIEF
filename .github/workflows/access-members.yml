name: Access Members

# ניהול רשימת המורשים ב-Cloudflare Access מבחוץ.
#
# ה-Function שבאתר יודעת רק להוסיף כתובת. הסרה נדרשת כשמנוי מסתיים,
# כשכתובת נוספה בטעות, או כשנלחץ קישור אישור שלא היה אמור להילחץ —
# ואין לה מסלול באתר עצמו.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "list = הצגה בלבד · remove = הסרה"
        type: choice
        options: [list, remove]
        default: list
      email:
        description: "כתובת להסרה (רק כש-action=remove)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Manage allowlist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ID: 431d3901-b519-4230-b22e-2c3eacfedce2
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.email }}
        run: python3 scripts/access_members.py
