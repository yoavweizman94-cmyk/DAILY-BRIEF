name: Brief Request

# כפתור "הפק ברייף" באתר → ריצת ברייף, בלי אסימון GitHub חדש.
#
# הכפתור רץ ב-Cloudflare Pages, ומשם אי אפשר לשגר workflow בלי אסימון
# שרק הבעלים יכול ליצור. לכן האתר כותב את הבקשה ל-KV — אותו מרחב שמות
# שבו יושבים המשתמשים — והפעימה הזו קוראת אותה, מוחקת אותה ומריצה את
# המהדורה. האסימון של Cloudflare כבר קיים כסוד בריפו.
#
# **פעימה ריקה היא זולה.** רוב הריצות מסתיימות תוך שניות: אין checkout
# מלא, אין התקנות, רק קריאה אחת ל-API. העלות היא רעש ברשימת הריצות.
#
# כשיוגדר GITHUB_DISPATCH_TOKEN, האתר ישגר ישירות והכפתור יפעל מיד;
# הפעימה הזו תישאר ותמצא תור ריק. שתי הדרכים חיות זו לצד זו בכוונה.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - ".trigger/brief-request.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brief-request
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.kv.outputs.run }}
      edition: ${{ steps.kv.outputs.edition }}
    steps:
      # רק הסקריפט, בלי היסטוריה ובלי שאר הריפו — זו ריצה שרצה 144 פעמים ביום.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/kv_request.py
            .trigger/brief-request.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      # בקובץ הטריגר אפשר לבקש בדיקה עצמית: {"seed": "midday"} כותב בקשה
      # זמנית ל-KV ותובע אותה, כדי לבדוק את מסלול הכפתור בלי להפיק מהדורה.
      - name: Self test flag
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, pathlib
          from datetime import datetime
          try:
              cfg = json.loads(pathlib.Path(".trigger/brief-request.json").read_text(encoding="utf-8"))
          except Exception:
              cfg = {}
          seed = str(cfg.get("seed") or "").strip()
          # הדגל נשמר בגיט, ולכן דגל שנשאר בקובץ שורד לדחיפה הבאה: בקשה
          # אמיתית הייתה הופכת לבדיקה שאינה מפיקה דבר. תקף רק לצד חותמת
          # זמן טרייה, כמו topics_only ב-brief_args.
          if seed:
              try:
                  age = (datetime.now() - datetime.fromisoformat(str(cfg.get("at")))).total_seconds() / 3600
              except (TypeError, ValueError):
                  age = 99
              if age > 2:
                  print(f"::notice title=דגל בדיקה ישן::seed בן {age:.0f} שעות — מתעלמים")
                  seed = ""
          print(f"KV_SEED={seed}")
          PY

      - name: Claim request
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/kv_request.py

  brief:
    needs: poll
    if: needs.poll.outputs.run == 'true'
    uses: ./.github/workflows/daily-brief.yml
    # actions: write — ריצת כפתור מפעילה גם את צנרות העמודים (daily-brief.yml,
    # refresh-pages). הרשאות של workflow שנקרא מוגבלות לאלה של הקורא.
    permissions:
      contents: write
      actions: write
    with:
      edition: ${{ needs.poll.outputs.edition }}
      source: kv
    secrets: inherit
