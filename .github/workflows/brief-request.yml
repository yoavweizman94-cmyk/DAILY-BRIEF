name: Brief Request

# כפתור "הפק ברייף" באתר → ריצת ברייף, גם כשהשיגור הישיר נכשל.
#
# הכפתור רץ ב-Cloudflare Pages ומשגר את daily-brief.yml באסימון
# GITHUB_DISPATCH_TOKEN. לפני השיגור הוא רושם את הלחיצה ל-KV — אותו מרחב
# שמות שבו יושבים המשתמשים — וכשהאסימון חסר או נדחה, הרישום הזה הוא כל מה
# שיש. הפעימה כאן מציצה ל-KV, ואם יש לחיצה שעוד לא בוצעה — קוראת לריצה.
#
# **הפעימה אינה תובעת (מ-13/11/2026).** עד אז היא מחקה את הבקשה ואז קראה
# לברייף, אבל הריצה שנקראה חיכתה בתור של daily-brief, ו-GitHub מבטל ממתינה
# כשמגיעה חדשה — ובקשה שכבר נמחקה אבדה. מאז הריצה עצמה תובעת את הלחיצה, רק
# כשהיא כבר מחזיקה את המקום (scripts/brief_claim.py), וכל ריצה אחרת של
# daily-brief שרואה לחיצה ממתינה משגרת אותה מחדש. הפעימה הזו היא רשת ביטחון
# שנייה: GitHub מריץ אותה כארבע פעמים ביממה.
#
# **פעימה ריקה היא זולה.** רוב הריצות מסתיימות תוך שניות: אין checkout
# מלא, אין התקנות, רק שלוש קריאות ל-API. העלות היא רעש ברשימת הריצות.
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - ".trigger/brief-request.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brief-request
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.kv.outputs.run }}
      edition: ${{ steps.kv.outputs.edition }}
      at: ${{ steps.kv.outputs.at }}
    steps:
      # רק הסקריפט, בלי היסטוריה ובלי שאר הריפו — זו ריצה שרצה 144 פעמים ביום.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/kv_request.py
            .trigger/brief-request.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      # בקובץ הטריגר אפשר לבקש בדיקה עצמית: {"seed": "midday"} כותב, קורא
      # ומוחק רשומה במפתח בדיקה נפרד — אותן הרשאות שהכפתור והתביעה צריכים —
      # בלי לגעת בלחיצה אמיתית ובלי להפיק מהדורה.
      - name: Self test flag
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, pathlib
          from datetime import datetime
          try:
              cfg = json.loads(pathlib.Path(".trigger/brief-request.json").read_text(encoding="utf-8"))
          except Exception:
              cfg = {}
          seed = str(cfg.get("seed") or "").strip()
          # הדגל נשמר בגיט, ולכן דגל שנשאר בקובץ שורד לדחיפה הבאה: בקשה
          # אמיתית הייתה הופכת לבדיקה שאינה מפיקה דבר. תקף רק לצד חותמת
          # זמן טרייה, כמו topics_only ב-brief_args.
          if seed:
              try:
                  age = (datetime.now() - datetime.fromisoformat(str(cfg.get("at")))).total_seconds() / 3600
              except (TypeError, ValueError):
                  age = 99
              if age > 2:
                  print(f"::notice title=דגל בדיקה ישן::seed בן {age:.0f} שעות — מתעלמים")
                  seed = ""
          print(f"KV_SEED={seed}")
          PY

      - name: Check for a pending click
        id: kv
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/kv_request.py

  # הלחיצה עוברת כ-inputs, וג'וב claim של daily-brief תובע אותה מ-KV. אם בינתיים ריצה
  # אחרת כבר ביצעה אותה, הקריאה הזו ממשיכה כרשת ביטחון ואינה מפיקה שוב.
  brief:
    needs: poll
    if: needs.poll.outputs.run == 'true'
    uses: ./.github/workflows/daily-brief.yml
    # actions: write — ריצת כפתור מפעילה גם את צנרות העמודים (daily-brief.yml,
    # refresh-pages). הרשאות של workflow שנקרא מוגבלות לאלה של הקורא.
    permissions:
      contents: write
      actions: write
    with:
      edition: ${{ needs.poll.outputs.edition }}
      source: kv
      requested_at: ${{ needs.poll.outputs.at }}
    secrets: inherit
