name: Content Rebrand

# הרצה חד-פעמית: נורמליזציה של כותרת ה-H1 בברייפים ההיסטוריים.
#
# השירות נקרא TLV TASE View, אבל 31 הברייפים נכתבו "# ברייף FOREST" —
# כל מהדורה העתיקה את מבנה הכותרת מקודמתה, כך שהמיתוג הישן שרד את שינוי
# השם והופיע ככותרת הדפדפן של עמוד הבית. run_daily.sh מנרמל מעכשיו כל
# ברייף חדש; זה מטפל בהיסטוריה.
#
# הסקריפט אידמפוטנטי — הרצה חוזרת אינה משנה דבר — ולכן ה-workflow אינו
# מסוכן, אבל גם אין לו שימוש חוזר. אפשר למחוק אותו אחרי שרץ.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Normalize headers
        run: python scripts/rebrand_briefs.py output

      - name: Verify none left
        run: |
          left=$(grep -l '^# ברייף FOREST' output/brief_*.md 2>/dev/null | wc -l)
          echo "ברייפים שנותרו במיתוג הישן: $left"
          [ "$left" = "0" ] || { echo "::error::נותרו $left ברייפים לא מתוקנים"; exit 1; }

      - name: Push content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          bash scripts/content_repo.sh push "מיתוג TLV TASE View בכותרת הברייפים"
