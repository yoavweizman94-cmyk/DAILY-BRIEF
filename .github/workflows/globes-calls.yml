name: Globes Calls

# תמלולי שיחות משקיעים מגלובס — גילוי, משיכה מאומתת וסיכום.
#
# **תלוי בעוגיית מנוי.** GLOBES_COOKIE הוא פלט "Copy as cURL" מדפדפן
# מחובר, והוא חייב לכלול גם את ה-User-Agent — סשן שמושמע מסוכן אחר
# נדחה. עוגיות פגות, ולכן הכישלון הצפוי כאן הוא "הסשן אינו מזוהה";
# הוא נאמר במפורש, קורה לפני כל קריאה ל-API, ואינו עולה דבר.
#
# **התמליל נשמר לצד הסיכום** — החלטה של יואב מ-25/08/2026, כשהאתר
# משמש אותו בלבד. אם הוא ייפתח ללקוחות, ראה את רשימת ההחזרה בראש
# ingest/globes_calls.py.
on:
  # אחת ליום, אחרי שגלובס מספיקה לפרסם את תמלולי היום. שיחה שכבר סוכמה
  # מדולגת לפי מזהה, ולכן ריצה שאין בה חדש אינה עולה דבר.
  #
  # **הריצה תלויה בעוגייה שפגה מדי פעם.** כשזה יקרה היא תיכשל לפני כל
  # קריאה ל-API — כלומר ללא עלות — והאנוטציה תגיד במפורש לרענן את
  # GLOBES_COOKIE. כישלון כזה הוא תזכורת, לא תקלה.
  schedule:
    - cron: "0 17 * * *"        # 20:00 ישראל בקיץ, 19:00 בחורף
  workflow_dispatch:
    inputs:
      mode:
        description: "מצב הרצה"
        type: choice
        required: true
        default: probe
        options: [probe, run]
      limit:
        description: "כמה תמלילים לסכם (רק במצב run)"
        required: false
        default: "8"
      all:
        description: "לסכם כל תמליל בערוץ ולא רק חברות כיסוי"
        type: boolean
        required: false
        default: false
      redo:
        description: "לסכם מחדש גם מה שכבר סוכם (בתשלום) — אחרי תיקון בפענוח"
        type: boolean
        required: false
        default: false
      article:
        description: "אבחון HTML של כתבה בודדת: מזהה did (אופציונלי)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: globes-calls
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  calls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Install
        run: pip install anthropic curl_cffi pyyaml truststore certifi markdown

      # אבחון HTML של כתבה בודדת — רק כשמבקשים במפורש מזהה.
      - name: Probe article
        if: inputs.article != ''
        env:
          GLOBES_COOKIE: ${{ secrets.GLOBES_COOKIE }}
          GLOBES_PROBE: ${{ inputs.article }}
        run: python scripts/globes_probe.py

      # אימות סשן + גילוי + משיכה אחת. אינו קורא ל-API ואינו עולה כסף.
      - name: Probe
        if: inputs.mode == 'probe'
        env:
          GLOBES_COOKIE: ${{ secrets.GLOBES_COOKIE }}
        run: python ingest/globes_calls.py --probe

      # ריצה מתוזמנת היא תמיד run: באירוע schedule אין inputs כלל,
      # ותנאי שמשווה ל-'run' בלבד היה משאיר את התזמון פעיל וריק.
      - name: Summarize transcripts
        if: github.event_name == 'schedule' || inputs.mode == 'run'
        env:
          GLOBES_COOKIE: ${{ secrets.GLOBES_COOKIE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ALL=""
          if [ "${{ inputs.all }}" = "true" ]; then ALL="--all"; fi
          if [ "${{ inputs.redo }}" = "true" ]; then ALL="$ALL --redo"; fi
          # ריצה מתוזמנת מגיעה בלי inputs, ומחרוזת ריקה ל---limit מפילה
          # את argparse עוד לפני שהסקריפט מתחיל.
          LIMIT="${{ inputs.limit }}"
          LIMIT="${LIMIT:-8}"
          python ingest/globes_calls.py --limit "$LIMIT" $ALL 2>&1 | tee calls.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            if grep -qi 'credit balance is too low\|insufficient.*credit\|quota' calls.log; then
              echo "::error title=יתרת Anthropic אזלה::טעינה: console.anthropic.com/settings/billing"
            elif grep -q 'אינו מזוהה' calls.log; then
              echo "::error title=עוגיית גלובס פגה::רענן את הסוד GLOBES_COOKIE מ-Copy as cURL בדפדפן מחובר."
            fi
            exit "$rc"
          fi

      # **ביטוח על עבודה משולמת.** ריצה #9 הפיקה שמונה סיכומים, ריצה #10
      # הפיקה את אותם שמונה שוב — כלומר הראשונים לא שרדו את השמירה, ואי
      # אפשר היה לדעת זאת בלי לשלם שלישית. הארטיפקט אינו תלוי בריפו
      # התוכן, ולכן ניתן להורידו גם כששלב השמירה נכשל.
      - name: Keep the summaries as an artifact
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: output/calls/transcripts_*.jsonl
          if-no-files-found: warn
          retention-days: 30

      # **הסיכומים נשמרים גם כשהשלבים הבאים ייפלו.** תמליל שסוכם כבר
      # שולם עליו; לזרוק אותו כי הפריסה נכשלה הוא לשלם פעמיים.
      - name: Commit summaries
        id: commit
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
        run: |
          CH="$(git -C output status --porcelain 2>/dev/null | wc -l)"
          FILES="$(ls -1 output/calls/transcripts_*.jsonl 2>/dev/null | wc -l)"
          LINES="$(cat output/calls/transcripts_*.jsonl 2>/dev/null | wc -l)"
          echo "::notice title=מצב לפני השמירה::שינויים בריפו התוכן $CH · קבצי תמלולים $FILES · שורות $LINES"
          if [ "$CH" -gt 0 ]; then
            set +e
            CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}' \
              bash scripts/content_repo.sh push globes-calls 2>&1 | tee push.log
            rc=${PIPESTATUS[0]}
            set -e
            echo "::notice title=תוצאת השמירה::קוד $rc — $(tail -1 push.log)"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=הסיכומים לא נשמרו::הם זמינים כארטיפקט transcripts בריצה הזו."
              exit 1
            fi
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "אין סיכומים חדשים לשמירה"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild site
        if: always() && steps.commit.outputs.changed == 'yes'
        run: python site/build.py

      - uses: actions/setup-node@v4
        if: always() && steps.commit.outputs.changed == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: always() && steps.commit.outputs.changed == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
