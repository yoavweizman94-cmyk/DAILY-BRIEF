name: Filings Backfill

# מילוי היסטוריית הדוחות אחורה, לילה אחר לילה.
#
# ה-WAF של מאיה מגביל לפי נפח בקשות ולא לפי טווח תאריכים: חלון של 7 ימים
# (≈33 עמודים) עובר, והבקשה שאחריו מקבלת 403. לכן אי אפשר למשוך שנתיים
# בהרצה אחת, והסקריפט מתקדם בחלונות עם שהייה, שומר מצב אחרי כל חלון וממשיך
# מאותה נקודה בהרצה הבאה. כמה לילות והאינדקס מגיע ל-`until`.
#
# הריפו ציבורי ולכן דקות ה-Actions חינם — התקציב כאן הוא זמן ריצה, לא עלות.
on:
  schedule:
    - cron: "0 0 * * *"        # 02:00/03:00 בישראל, אחרי מהדורת הלילה
  workflow_dispatch:
    inputs:
      until:
        description: "עד לאיזה תאריך למלא אחורה (YYYY-MM-DD)"
        default: "2024-01-01"
      budget_minutes:
        description: "תקציב זמן להרצה"
        default: "20"

permissions:
  contents: write

# אותה קבוצה כמו maya-watch, בכוונה: שניהם כותבים ל-output/filings, ושתי
# ריצות חופפות מייצרות קונפליקט על manifest.json ועל קובצי השנה. עדיף
# להשהות מחזור ניטור אחד בשעת לילה מאשר לפתור קונפליקט על קבצים מחוללים.
# התקציב מוגבל ל-20 דקות כדי שהחלון הזה יישאר קצר.
concurrency:
  group: maya-watch
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ריפו התוכן הפרטי משוכפל אל output/, כך שכל הסקריפטים ממשיכים לעבוד
      # על אותם נתיבים בעוד המחקר עצמו כבר אינו בריפו הציבורי.
      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - run: pip install curl_cffi pyyaml truststore certifi requests markdown

      - name: Backfill
        id: run
        run: |
          python ingest/maya_index.py --backfill \
            --until "${{ inputs.until || '2024-01-01' }}" \
            --budget-minutes "${{ inputs.budget_minutes || 20 }}"
          if [ -n "$(git status --porcelain output/filings)" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.run.outputs.changed == 'yes'
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/maya_index_state.json
          git diff --cached --quiet || git commit -m "filings: מילוי אחורה $(date +'%F')"
          bash scripts/git_sync.sh
          CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}' bash scripts/content_repo.sh push filings

      - name: Rebuild site
        if: steps.run.outputs.changed == 'yes'
        run: python site/build.py

      # פריסה ל-Cloudflare Pages. החליף את GitHub Pages, שאינו יודע לבקש
      # הזדהות בכלל — Cloudflare Access יושב לפני האתר וחוסם כברירת מחדל.
      - uses: actions/setup-node@v4
        if: steps.run.outputs.changed == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.run.outputs.changed == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail: בלי זה קוד היציאה הוא של tee ופריסה שנכשלה נראית ירוקה
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
