name: Access Flow Check

# אימות זרימת בקשת הגישה מקצה לקצה, מחוץ לרשת הארגונית.
#
# **שולח מייל אמיתי** אל OWNER_EMAIL, ולכן ידני בלבד — בלי cron.
#
# כתובת הבקשה היא access-check@tlvtaseview.com, ו-approve.js חוסם אותה
# מפורשות: גם עם חתימה תקפה היא לא תיכנס לרשימת המורשים. השומר הזה נוסף
# אחרי שהכפתור נלחץ בטעות ב-19/08/2026 והכתובת אכן נוספה.
#
# הבדיקה קובעת שלושה דברים: שהוולידציה דוחה קלט פסול, שכל משתני הסביבה
# קיימים (503 מסגיר חוסר), ושחתימת ה-HMAC על קישור האישור אינה ניתנת
# לזיוף. האחרון הוא הבדיקה החשובה — קישור אישור שאפשר להמציא פירושו
# שכל אחד מכניס את עצמו לאתר.
on:
  # אין cron בכוונה — הבדיקה שולחת מייל אמיתי. דחיפת קובץ הטריגר
  # מפעילה אותה כשצריך לאבחן, בלי לדרוש אסימון GitHub.
  push:
    paths:
      - ".trigger/access-check.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # **בלי זה אין scripts/users.py בסביבת העבודה**, והניקוי שבסוף
      # הבדיקה נכשל בכל ריצה. הוא נכשל בשקט (`|| true`), ולכן חשבונות
      # הבדיקה נערמו ברשימת המשתמשים — בדיוק מה שהוא נועד למנוע.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe access flow
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: b437bf78b9bc4f358b6d0b4a64e0ad94
        run: |
          fail=0
          bad()  { echo "::error::$*"; fail=1; }
          note() { echo "  $*"; }
          B=https://tlvtaseview.com
          # הבדיקה יוצרת חשבון ממתין בכל ריצה; בלי הניקוי הם נערמים
          # ברשימת המשתמשים ומטשטשים מי באמת ביקש גישה.
          cleanup() {
            for e in access-check@tlvtaseview.com short-pw@tlvtaseview.com; do
              # ניקוי שנכשל בשקט הוא בדיוק מה שהשאיר חשבון בדיקה תקוע
              # ברשימה וגרם לחשוב שמישהו אמיתי ממתין לאישור.
              if ! ACTION=delete EMAIL="$e" python3 scripts/users.py >/dev/null 2>&1; then
                echo "::warning::ניקוי חשבון הבדיקה $e נכשל — הוא נשאר ברשימת המשתמשים"
              fi
            done
          }
          trap cleanup EXIT

          echo "=== 1. ולידציה של קלט ==="
          : > r1.json
          code=$(curl -s -o r1.json -w '%{http_code}' --max-time 25 -X POST "$B/api/register" \
                 -H 'content-type: application/json' \
                 --data '{"name":"בדיקה","email":"not-an-email","password":"a-long-password"}' || true)
          note "מייל פסול → $code   $(cat r1.json)"
          if [ "$code" != "400" ]; then bad "מייל פסול החזיר $code במקום 400"; fi

          echo "=== 1.5 הטופס החי תואם לנקודת הקצה ==="
          : > land.html
          curl -sL -o land.html --max-time 25 "$B/" || true
          for need in 'id="rpw"' 'id="rpw2"' '/api/register'; do
            if grep -q "$need" land.html; then note "$need ✓"; else bad "בטופס החי חסר $need — הדף והשרת אינם מסונכרנים"; fi
          done
          if grep -q '/api/request-access' land.html; then
            bad "הטופס עדיין שולח ל-/api/request-access, שאינו קיים"
          fi

          echo "=== 2. בקשה תקינה (שולח מייל) ==="
          : > r2.json
          code=$(curl -s -o r2.json -w '%{http_code}' --max-time 30 -X POST "$B/api/register" \
                 -H 'content-type: application/json' \
                 --data '{"name":"בדיקה אוטומטית — אין לאשר","email":"access-check@tlvtaseview.com","password":"check-only-not-a-real-account"}' || true)
          note "בקשה תקינה → $code   $(cat r2.json)"
          case "$code" in
            200) if grep -q '"notified":true' r2.json; then note "החשבון נוצר והמייל נשלח ✓";
                 elif grep -q '"mail":"unconfigured"' r2.json; then bad "החשבון נוצר; דואר אינו מוגדר — חסר RESEND_API_KEY או OWNER_EMAIL";
                 else bad "החשבון נוצר; Resend דחה — $(grep -o '\"mailStatus\":[0-9]*' r2.json). 401=מפתח פסול, 403=דומיין לא מאומת, 422=כתובת שולח"; fi ;;
            503) bad "השירות אינו מוגדר במלואו — חסר RESEND_API_KEY / OWNER_EMAIL / APPROVAL_SECRET / USERS" ;;
            409) note "החשבון כבר קיים — הזרימה תקינה ✓" ;;
            502) bad "Resend דחה את השליחה" ;;
            *)   bad "בקשה תקינה החזירה $code" ;;
          esac

          echo "=== 2.2 קישור האישור עמיד לקידוד מייל ==="
          # ‎"=" בקישור נבלע בקידוד quoted-printable יחד עם שני התווים
          # שאחריו. כיוון שהטוקן הקסדצימלי, זה קורה תמיד. הקישור חייב
          # להיות נתיב נקי.
          if grep -q 'api/approve?' land.html; then
            bad "עמוד הנחיתה מפנה לקישור אישור עם מחרוזת שאילתה"
          else
            note "אין מחרוזת שאילתה בקישור האישור ✓"
          fi

          echo "=== 2.5 סיסמה קצרה נדחית ==="
          : > r25.json
          code=$(curl -s -o r25.json -w '%{http_code}' --max-time 25 -X POST "$B/api/register" -H 'content-type: application/json' --data '{"name":"בדיקה","email":"short-pw@tlvtaseview.com","password":"short"}' || true)
          note "סיסמה קצרה → $code   $(cat r25.json)"
          if [ "$code" = "400" ]; then note "נדחתה ✓"; else bad "סיסמה בת 5 תווים התקבלה ($code)"; fi

          echo "=== 3. קישור אישור מזויף חייב להידחות ==="
          : > r3.json
          code=$(curl -s -o r3.json -w '%{http_code}' --max-time 25 \
                 "$B/api/approve/YXR0YWNrZXJAZXZpbC5jb20.deadbeefdeadbeef" || true)
          note "חתימה מזויפת → $code   $(head -c 200 r3.json)"
          if [ "$code" = "200" ]; then
            bad "קישור אישור מזויף התקבל — כשל אבטחה חמור"
          else
            note "נדחה ✓"
          fi

          echo "=== 4. אישור בלי חתימה כלל ==="
          : > r4.json
          code=$(curl -s -o r4.json -w '%{http_code}' --max-time 25 \
                 "$B/api/approve/YXR0YWNrZXJAZXZpbC5jb20" || true)
          note "בלי חתימה → $code   $(head -c 120 r4.json)"
          # מה שחשוב אינו קוד התשובה אלא התוצאה: נתיב בלי חתימה אינו
          # מנותב לפונקציה כלל ומוגש כנכס סטטי, ולכן 200 כאן תקין —
          # כל עוד שום חשבון לא הופעל.
          if grep -q "החשבון הופעל" r4.json; then
            bad "אישור ללא חתימה הפעיל חשבון"
          else
            note "לא הופעל חשבון ✓"
          fi

          echo "=== 5. כתובת הבדיקה חסומה לאישור ==="
          # השומר ב-approve.js יושב לפני אימות החתימה, ולכן די בטוקן כלשהו
          # כדי לאמת אותו — הסוד אינו נדרש כאן.
          : > r5.json
          code=$(curl -s -o r5.json -w '%{http_code}' --max-time 25                  "$B/api/approve/YWNjZXNzLWNoZWNrQHRsdnRhc2V2aWV3LmNvbQ.whatever" || true)
          title=$(grep -o '<title>[^<]*' r5.json | head -1 | cut -c8-40)
          note "כתובת בדיקה → $code   כותרת: $title"
          if echo "$title" | grep -q "כתובת בדיקה"; then
            note "חסומה ✓"
          else
            bad "השומר על כתובת הבדיקה אינו פעיל — קיבלנו \"$title\" ($code)"
          fi

          echo
          if [ "$fail" = "0" ]; then
            echo "זרימת בקשת הגישה תקינה. בדוק שהמייל הגיע לתיבה."
          else
            echo "יש כשלים — ראו ::error:: למעלה."
          fi
          exit "$fail"
