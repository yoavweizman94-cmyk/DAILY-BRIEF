name: Gov Watch

# עמודי הרגולציה (gov-communications/electricity/transport.html): פרסומי משרד
# התקשורת, רשות החשמל ומשרד התחבורה מה-API הפתוח של gov.il, וסיקור של מה
# שמהותי לחברות הנסחרות. מקורות ומפת החברות: config/gov.yaml.
#
# **שלוש ריצות ביום, א'–ה'** — ימי העבודה של הממשלה. השעות מוזזות מצנרת
# הרכב (05:10, 10:40, 15:50 UTC) ומהלמ"ס (06:00, 11:15, 16:45 UTC), כדי ששתי
# פריסות של האתר לא ירוצו באותן דקות:
#   06:25 UTC — 09:25 קיץ / 08:25 חורף
#   10:25 UTC — 13:25 קיץ / 12:25 חורף
#   14:25 UTC — 17:25 קיץ / 16:25 חורף
#
# **הסיקור משלם רק כשיש מה לסקר.** analyze_gov ממיין פרסומים שעוד לא מוינו,
# ומסקר מהותיים שעוד אין להם סיקור; כשאין כאלה — אין קריאה למודל.
on:
  schedule:
    - cron: "25 6 * * 0-4"
    - cron: "25 10 * * 0-4"
    - cron: "25 14 * * 0-4"
  push:
    paths:
      - ".trigger/gov-watch.json"
  workflow_dispatch: {}

# אין כתיבה לריפו הציבורי: הפרסומים והסיקור נשמרים בריפו התוכן הפרטי.
permissions:
  contents: read

concurrency:
  group: gov-watch
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Install collector dependencies
        run: pip install pyyaml truststore certifi curl_cffi pypdf

      - name: Collect regulator publications
        id: collect
        run: python ingest/gov_pull.py

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install analyzer
        run: npm install -g @anthropic-ai/claude-code

      # כישלון בסיקור אינו מפיל את הריצה: הפרסומים עצמם שווים שמירה ופריסה,
      # והעמוד אומר על פרסום מהותי שעוד אין לו סיקור.
      - name: Triage and survey
        id: analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: |
          set +e
          python scripts/analyze_gov.py 2>&1 | tee analyze.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=סיקור הרגולציה נכשל (קוד $rc)::הפרסומים נשמרים ונפרסים; הסיקור ינוסה שוב בריצה הבאה."
          fi
          exit 0

      - name: Save content
        if: steps.collect.outputs.changed == 'yes' || steps.analyze.outputs.analyzed == 'yes'
        run: CONTENT_DEPLOY_KEY='${{ secrets.CONTENT_DEPLOY_KEY }}' bash scripts/content_repo.sh push gov

      # התוכן נמשך שוב לפני הבנייה: צנרת אחרת עשויה הייתה לדחוף מאז, ובנייה על
      # עותק ישן הייתה דורסת באתר תוכן חדש יותר.
      - name: Refresh content before build
        if: steps.collect.outputs.changed == 'yes' || steps.analyze.outputs.analyzed == 'yes'
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Build site
        if: steps.collect.outputs.changed == 'yes' || steps.analyze.outputs.analyzed == 'yes'
        run: |
          pip install -r requirements.txt
          python site/build.py

      - name: Check inline JS
        if: steps.collect.outputs.changed == 'yes' || steps.analyze.outputs.analyzed == 'yes'
        run: python scripts/check_inline_js.py

      - name: Deploy to Cloudflare Pages
        if: steps.collect.outputs.changed == 'yes' || steps.analyze.outputs.analyzed == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
