name: Content Check

# אימות נתיב הכתיבה לריפו התוכן הפרטי, בלי קריאת מודל.
# בלי זה, כשל בכתיבה היה מתגלה רק כשמהדורה שלמה כבר הופקה ואבדה.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Pull content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Write heartbeat and push
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          date -u +'%FT%TZ' > output/.pipeline-heartbeat
          bash scripts/content_repo.sh push heartbeat

      - name: Freshness
        # נתיב כתיבה תקין אינו מעיד שמישהו כותב. שוק הדיור לא הגיע לריפו
        # שלושה ימים בזמן ש-Nadlan Scan דיווח הצלחה בכל יום, כי הסריקה
        # החזירה אפס והדחיפה כתבה "אין שינוי בתוכן" ויצאה 0.
        run: |
          set -u
          fail=0
          yr=$(date +%Y)
          check() {  # נתיב · ימים מותרים · תיאור
            local path="$1" days="$2" what="$3"
            if [ ! -s "output/$path" ]; then
              echo "::error::$what — $path חסר או ריק"; fail=1; return
            fi
            local iso age
            iso=$(git -C output log -1 --format=%cI -- "$path")
            if [ -z "$iso" ]; then
              echo "::error::$what — אין קומיט שנגע ב-$path"; fail=1; return
            fi
            age=$(( ( $(date -u +%s) - $(date -u -d "$iso" +%s) ) / 86400 ))
            if [ "$age" -gt "$days" ]; then
              echo "::error::$what — עודכן לפני $age ימים (מותר עד $days)"; fail=1
            else
              echo "$what ✓ ($age ימים, $(grep -c . "output/$path") שורות)"
            fi
          }
          check "nadlan/$yr.jsonl" 3 "שוק הדיור"
          check "offex/$yr.jsonl"  3 "עסקאות מחוץ לבורסה"
          exit "$fail"

      - name: Confirm it landed
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          rm -rf output
          bash scripts/content_repo.sh pull
          if [ -f output/.pipeline-heartbeat ]; then
            echo "נתיב הכתיבה תקין · $(cat output/.pipeline-heartbeat)"
          else
            echo "::error::הקובץ לא הגיע לריפו הפרטי"
            exit 1
          fi
