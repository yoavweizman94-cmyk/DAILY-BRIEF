name: Setup Domains

# הקמת ההפרדה בין עמוד הנחיתה הציבורי לאפליקציה המוגנת.
#
# הסדר כאן אינו שרירותי: ההגנה על app.tlvtaseview.com נוצרת ומאומתת לפני
# שההגנה מוסרת מהאפקס. הסדר ההפוך היה חושף את התוכן, ולו לרגע.
on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: "מייל מורשה"
        required: true
        default: "yoavweizman94@gmail.com"
      release_apex:
        description: "לשחרר את האפקס מהגנה (רק אחרי אימות)"
        default: "false"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER: ${{ inputs.owner_email }}
          RELEASE: ${{ inputs.release_apex }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/setup_domains.py
