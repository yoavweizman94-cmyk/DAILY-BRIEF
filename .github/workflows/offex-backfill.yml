name: Offex Backfill

# איסוף היסטורי של עסקאות מניה מחוץ לבורסה מטופס ת076.
#
# רץ כאן ולא מקומית: הסריקה נוגעת במאות ימים, ומאיה מגבילה כתובת שסורקת
# בקצב כזה. ה-state מתקדם רק עד היום שנסרק ברצף, כך שהרצה חוזרת ממשיכה
# מהנקודה שבה נעצרה במקום לדלג על מה שנכשל.
on:
  # **סוגר פערים אחרי ימים שנפלו.** הברייף מביא את עסקאות היום בכל
  # מהדורה, אבל יום שבו otc או offex נכשלו נשאר חסר לתמיד — וזה בדיוק
  # מה שקרה: הריצה האחרונה כאן הייתה ידנית ב-21/08 והיא נכשלה.
  # **כל שעה**, לבקשת יואב מ-28/08/2026. הסריקה אינה עולה API — היא
  # מושכת מסקירת הבורסה וממאיה — והצינור מדלג על מה שכבר נאסף, ולכן
  # שעה שאין בה עסקה חדשה יוצאת בלי לדחוף ובלי לפרוס.
  schedule:
    - cron: "20 * * * *"
  push:
    paths:
      - ".trigger/offex-backfill.json"
  workflow_dispatch:
    inputs:
      from_date:
        description: "מאיזה תאריך YYYY-MM-DD (ריק = להמשיך מה-state)"
        required: false
        default: ""
      until:
        description: "עד איזה תאריך YYYY-MM-DD (ריק = היום)"
        required: false
        default: ""
      tase_history:
        description: "למשוך גם היסטוריית עסקאות מסקירת הבורסה לחברות הכיסוי"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install curl_cffi pyyaml truststore certifi

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Scan
        env:
          OFFEX_FROM: ${{ inputs.from_date }}
          OFFEX_UNTIL: ${{ inputs.until }}
        run: python ingest/offex_pull.py

      # מקור שני, משלים ולא חלופי: מאיה נותנת זהויות, סקירת הבורסה
      # נותנת את העסקאות שאיש לא היה חייב לדווח עליהן.
      - name: TASE history
        if: inputs.tase_history
        env:
          OTC_BACKFILL: "1"
        run: python ingest/otc_pull.py

      - name: Summary
        if: always()
        run: |
          f="output/offex/$(date +%Y).jsonl"
          if [ -s "$f" ]; then
            echo "רשומות בקובץ: $(grep -c . "$f")"
            echo "ראשונה: $(head -1 "$f" | cut -c1-160)"
            echo "אחרונה: $(tail -1 "$f" | cut -c1-160)"
          else
            echo "::warning::הקובץ ריק או חסר"
          fi
          echo "state: $(cat data/offex_state.json 2>/dev/null || echo 'אין')"

      - name: Push content
        id: content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          if [ -n "$(git -C output status --porcelain 2>/dev/null)" ]; then
            bash scripts/content_repo.sh push "עסקאות מחוץ לבורסה"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "אין תוכן חדש"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      # מצב הסריקה יושב בריפו הקוד ולא בריפו התוכן. בלעדיו כל ריצה
      # יומית מתחילה מחדש מלפני שלושה ימים ופער ארוך יותר לא נסגר.
      - name: Push scan state
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offex_state.json data/otc_state.json
          git diff --cached --quiet || git commit -m "offex: מצב סריקה"
          bash scripts/git_sync.sh

      # **מי שמייצר תוכן חייב גם לפרוס אותו.** בלי השלבים האלה הנתונים
      # מגיעים לריפו התוכן ונשארים שם עד שצינור אחר יבנה את האתר —
      # ואם אף אחד לא בונה, האתר מציג את של אתמול. נמדד ב-27/08:
      # העסקאות ושוק הדיור נסרקו בהצלחה, והעמודים הראו את 26/08.
      #
      # השלבים רצים רק כשבאמת השתנה תוכן, ולכן ריצה שאין בה חדש אינה
      # פורסת מחדש אתר זהה.
      - name: Rebuild site
        if: steps.content.outputs.changed == 'yes'
        run: |
          pip install --quiet markdown pyyaml
          python site/build.py

      - uses: actions/setup-node@v4
        if: steps.content.outputs.changed == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.content.outputs.changed == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
