name: Offex Backfill

# איסוף היסטורי של עסקאות מניה מחוץ לבורסה מטופס ת076.
#
# רץ כאן ולא מקומית: הסריקה נוגעת במאות ימים, ומאיה מגבילה כתובת שסורקת
# בקצב כזה. ה-state מתקדם רק עד היום שנסרק ברצף, כך שהרצה חוזרת ממשיכה
# מהנקודה שבה נעצרה במקום לדלג על מה שנכשל.
on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "מאיזה תאריך YYYY-MM-DD (ריק = להמשיך מה-state)"
        required: false
        default: ""
      until:
        description: "עד איזה תאריך YYYY-MM-DD (ריק = היום)"
        required: false
        default: ""
      tase_history:
        description: "למשוך גם היסטוריית עסקאות מסקירת הבורסה לחברות הכיסוי"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install curl_cffi pyyaml truststore certifi

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Scan
        env:
          OFFEX_FROM: ${{ inputs.from_date }}
          OFFEX_UNTIL: ${{ inputs.until }}
        run: python ingest/offex_pull.py

      # מקור שני, משלים ולא חלופי: מאיה נותנת זהויות, סקירת הבורסה
      # נותנת את העסקאות שאיש לא היה חייב לדווח עליהן.
      - name: TASE history
        if: inputs.tase_history
        env:
          OTC_BACKFILL: "1"
        run: python ingest/otc_pull.py

      - name: Summary
        if: always()
        run: |
          f="output/offex/$(date +%Y).jsonl"
          if [ -s "$f" ]; then
            echo "רשומות בקובץ: $(grep -c . "$f")"
            echo "ראשונה: $(head -1 "$f" | cut -c1-160)"
            echo "אחרונה: $(tail -1 "$f" | cut -c1-160)"
          else
            echo "::warning::הקובץ ריק או חסר"
          fi
          echo "state: $(cat data/offex_state.json 2>/dev/null || echo 'אין')"

      - name: Push content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          bash scripts/content_repo.sh push "עסקאות מחוץ לבורסה"

      # מצב הסריקה יושב בריפו הקוד ולא בריפו התוכן. בלעדיו כל ריצה
      # יומית מתחילה מחדש מלפני שלושה ימים ופער ארוך יותר לא נסגר.
      - name: Push scan state
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offex_state.json data/otc_state.json
          git diff --cached --quiet || git commit -m "offex: מצב סריקה"
          bash scripts/git_sync.sh
