name: Nadlan Scan

# סריקת עסקאות נדל"ן בגוש דן, בדרום ובצפון.
#
# רצה ממילא בכל בוקר כחלק מ-run_daily.sh. ה-workflow הזה נועד להרצה
# יזומה: אחרי שינוי ברשימת הערים, להרחבת חלון הזמן, או כשעיר מסוימת
# חזרה ריקה ורוצים לבדוק אותה לבד.
on:
  # מהדורת הבוקר סורקת ממילא. זו רשת ביטחון שבועית לערים שנפלו —
  # `data/nadlan_state.json` מפריד בין עיר שנכשלה לעיר ריקה, והריצה
  # הזו נותנת לראשונות הזדמנות נוספת בלי לסרוק הכל מחדש כל יום.
  schedule:
    - cron: "30 1 * * 6"
  push:
    paths:
      - ".trigger/nadlan-scan.json"
  workflow_dispatch:
    inputs:
      city:
        description: "עיר אחת (ריק = כל הערים)"
        required: false
        default: ""
      months:
        description: "חלון בחודשים (ריק = לפי הקונפיג)"
        required: false
        default: ""
      reprobe:
        description: "לאתר מחדש את החלקות במקום להשתמש במטמון"
        type: boolean
        required: false
        default: false
      diagnose:
        description: "אבחון גישה ל-Govmap במקום סריקה"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: content-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # curl_cffi אינו אופציונלי: govmap.gov.il חוסם requests רגיל לפי
        # טביעת TLS, וההתקנה הצרה שהייתה כאן הפילה את כל 33 הערים.
        run: pip install requests curl_cffi pyyaml truststore certifi

      - name: Fetch private content
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Diagnose access
        if: inputs.diagnose
        env:
          SCAN_KEY: ${{ secrets.SCAN_KEY }}
        run: python scripts/govmap_probe.py

      - name: Scan
        if: '!inputs.diagnose'
        env:
          NADLAN_CITY: ${{ inputs.city }}
          NADLAN_MONTHS: ${{ inputs.months }}
          NADLAN_REPROBE: ${{ inputs.reprobe && '1' || '' }}
          GOVMAP_PROXY: https://app.tlvtaseview.com/api/govmap
          SCAN_KEY: ${{ secrets.SCAN_KEY }}
        run: python ingest/nadlan_pull.py

      - name: Summary
        if: always() && !inputs.diagnose
        run: |
          set -e
          total=0
          for y in output/nadlan/*.jsonl; do
            [ -s "$y" ] || continue
            n=$(grep -c . "$y")
            total=$((total + n))
            echo "$(basename "$y"): $n עסקאות"
          done
          echo "סה\"כ בקבצים: $total"
          python3 -c "import json;d=json.load(open('data/nadlan_state.json',encoding='utf-8'));f=d.get('failed') or [];print('ערים שנכשלו:', ', '.join(f) or 'אין')"
          # ריצה שלא הותירה ולו עסקאה אחת אינה "הצלחה עם אזהרה".
          [ "$total" -gt 0 ]

      - name: Push content
        id: content
        if: '!inputs.diagnose'
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: |
          if [ -n "$(git -C output status --porcelain 2>/dev/null)" ]; then
            bash scripts/content_repo.sh push "עסקאות נדלן"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "אין תוכן חדש"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Push scan state
        if: '!inputs.diagnose'
        run: |
          git config user.name "forest-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nadlan_state.json
          git diff --cached --quiet || git commit -m "nadlan: מצב סריקה"
          bash scripts/git_sync.sh

      # **מי שמייצר תוכן חייב גם לפרוס אותו.** בלי השלבים האלה הנתונים
      # מגיעים לריפו התוכן ונשארים שם עד שצינור אחר יבנה את האתר —
      # ואם אף אחד לא בונה, האתר מציג את של אתמול. נמדד ב-27/08:
      # העסקאות ושוק הדיור נסרקו בהצלחה, והעמודים הראו את 26/08.
      #
      # השלבים רצים רק כשבאמת השתנה תוכן, ולכן ריצה שאין בה חדש אינה
      # פורסת מחדש אתר זהה.
      # **התוכן נמשך שוב לפני הבנייה.** כל צינור מושך את ריפו התוכן
      # בתחילתו, ומאז ועד הבנייה עוברות דקות שבהן צינור אחר עשוי לדחוף.
      # בלי הרענון הזה הבנייה נעשית על עותק ישן, והפריסה **דורסת** תוכן
      # חדש יותר שכבר נמצא באתר. נמדד 28/08: offex פרס 75 תמלולים בזמן
      # ש-globes כבר שמר 80.
      - name: Refresh content before build
        if: steps.content.outputs.changed == 'yes'
        env:
          CONTENT_DEPLOY_KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
        run: bash scripts/content_repo.sh pull

      - name: Rebuild site
        if: steps.content.outputs.changed == 'yes'
        run: |
          pip install --quiet markdown pyyaml
          python site/build.py

      - uses: actions/setup-node@v7
        if: steps.content.outputs.changed == 'yes'
        with:
          node-version: "20"

      - name: Deploy to Cloudflare Pages
        if: steps.content.outputs.changed == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          (cd site && npx --yes wrangler@4 pages deploy dist --project-name forest-brief --branch main) 2>&1 | tee dep.log
          grep -qE 'https://[a-z0-9.-]+\.pages\.dev' dep.log || {
            echo "::error::הפריסה לא החזירה כתובת"; exit 1; }
